<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日色环 / Daily Color Circle</title>
<style>
  /* ========== 全局基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #FAF6EE; /* 米白/浅奶油底 */
    color: #3A3630;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; color: inherit; }

  /* ========== 页面切换 ========== */
  .page { display: none; min-height: 100%; }
  .page.active { display: block; }

  /* ========== 主页 ========== */
  #page-home {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  #page-home.active { display: flex; }

  /* 顶部两个入口卡片 */
  .entries { display: flex; gap: 14px; width: 100%; max-width: 420px; margin-top: 8px; }
  .entry-card {
    flex: 1;
    background: #FFFDF8;
    border: 1px solid #EFE7D6;
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #5A5347;
    box-shadow: 0 2px 8px rgba(180, 165, 120, 0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .entry-card:active { transform: scale(0.97); }
  .entry-card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .entry-card.cal .dot { background: #4A7BD0; }
  .entry-card.note .dot { background: #FFB84D; }

  /* 中间大圆圈 */
  .circle-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px 0 10px; width: 100%; }
  #circle {
    width: min(74vw, 320px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #FFD84D;
    box-shadow: 0 10px 34px rgba(230, 190, 60, 0.35);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 8%;
    cursor: pointer;
    transition: background-color 0.8s ease, box-shadow 0.4s ease, transform 0.2s ease;
    animation: breathe 5s ease-in-out infinite;
  }
  #circle:active { transform: scale(0.98); }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.018); }
  }
  .circle-inner { pointer-events: none; }
  #date-text { font-size: clamp(16px, 4.6vw, 20px); font-weight: 600; letter-spacing: 1px; }
  #count-line { margin-top: 8px; font-size: clamp(12px, 3.4vw, 14px); opacity: 0.85; }
  #daily-rec {
    margin-top: 12px;
    font-size: clamp(11px, 3vw, 13px);
    line-height: 1.7;
    max-width: 100%;
  }
  .hint { margin-top: 18px; font-size: 12px; color: #A79C86; letter-spacing: 2px; }

  /* ========== 今日记录页 ========== */
  #page-record { min-height: 100vh; display: none; flex-direction: column; }
  #page-record.active { display: flex; }
  .record-header {
    display: flex; align-items: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 12px;
    background: #FFFDF8; border: 1px solid #EFE7D6;
    font-size: 18px; line-height: 1; color: #5A5347;
    flex-shrink: 0;
  }
  .record-title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }

  /* 左右分半：移动端也保持左右布局 */
  .record-cols { flex: 1; display: flex; align-items: stretch; padding: 0 8px 24px; gap: 8px; }
  .col { flex: 1 1 0; min-width: 0; border-radius: 16px; padding: 14px 10px 18px; display: flex; flex-direction: column; }
  .col-high { background: rgba(255, 90, 95, 0.06); border: 1px solid rgba(255, 90, 95, 0.14); }
  .col-down { background: rgba(74, 123, 208, 0.06); border: 1px solid rgba(74, 123, 208, 0.14); }
  .col h2 {
    font-size: clamp(15px, 4.2vw, 19px);
    letter-spacing: 3px; text-align: center; margin-bottom: 4px;
  }
  .col-high h2 { color: #FF5A5F; }
  .col-down h2 { color: #4A7BD0; }
  .col-sub { text-align: center; font-size: 11px; color: #A79C86; margin-bottom: 12px; letter-spacing: 1px; }

  /* 已添加事项：横线手账感 */
  .item-list { list-style: none; flex: 0 0 auto; }
  .item-list li {
    border-bottom: 1px solid rgba(120, 110, 90, 0.18);
    padding: 7px 2px;
    font-size: clamp(12px, 3.3vw, 14px);
    line-height: 1.45;
    word-break: break-all;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .item-main { display: flex; align-items: center; gap: 6px; }
  .item-list .item-text { flex: 1; min-width: 0; }
  .item-edit { flex-shrink: 0; font-size: 13px; color: #B3A88F; line-height: 1; }
  /* 事项操作行：批注 / 自查 */
  .item-actions { display: flex; gap: 14px; margin-top: 3px; padding-left: 2px; }
  .item-actions button { font-size: 11px; color: #B3A88F; letter-spacing: 1px; }
  /* 事项批注 */
  .anno-btn { flex-shrink: 0; font-size: 11px; color: #B3A88F; margin-left: 2px; }
  .anno-box { display: flex; gap: 6px; margin-top: 6px; padding-left: 4px; }
  .anno-box.hidden { display: none; }
  .edit-box { display: flex; gap: 6px; margin-top: 6px; padding-left: 4px; }
  .edit-box.hidden { display: none; }
  .anno-box input,
  .edit-box input {
    flex: 1; min-width: 0; background: transparent; border: none;
    border-bottom: 1px dashed rgba(120,110,90,0.4); padding: 4px 2px;
    font-size: 12px; outline: none;
  }
  .anno-save { flex-shrink: 0; font-size: 11px; padding: 4px 10px; border-radius: 8px; background: #B9A06A; color: #fff; }
  .anno-show { font-size: 11px; color: #9A8F76; margin-top: 4px; padding-left: 4px; white-space: pre-wrap; word-break: break-all; }
  .day-anno { font-size: 11px; color: #9A8F76; margin-top: 3px; }
  /* Down 自查小清单 */
  .check-box { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; padding: 8px 10px; background: rgba(74,123,208,0.05); border-radius: 10px; }
  .check-box.hidden { display: none; }
  .check-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #5A5347; }
  .check-row input { width: 15px; height: 15px; accent-color: #4A7BD0; }

  /* 给未来的自己一句话 */
  .future-card {
    background: #FFFDF8; border: 1px solid #EFE7D6; border-radius: 14px;
    padding: 10px 14px; margin: 0 8px 12px;
  }
  .future-label { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #8A7B4E; margin-bottom: 6px; }
  .future-row { display: flex; gap: 8px; align-items: center; }
  .future-row input {
    flex: 1; min-width: 0; background: transparent; border: none;
    border-bottom: 1px dashed rgba(120,110,90,0.4); padding: 5px 2px; font-size: 13px; outline: none;
  }
  .future-row button { flex-shrink: 0; font-size: 12px; padding: 5px 14px; border-radius: 9px; background: #FFD84D; color: #5A4A10; font-weight: 600; }
  .future-saved { font-size: 12px; color: #6B6453; margin-top: 6px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }

  /* 主页问候语 */
  .greeting {
    max-width: 320px; text-align: center;
    font-size: clamp(13px, 3.6vw, 15px); color: #6B6453;
    line-height: 1.7; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  /* 记录页今日小提示（可选看） */
  .tip-card {
    background: #FFFDF8; border: 1px solid #EFE7D6; border-radius: 14px;
    padding: 10px 14px; margin: 4px 8px 12px; font-size: 13px; color: #5A5347;
  }
  .tip-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; letter-spacing: 1px; }
  .tip-head button { font-size: 11px; color: #A79C86; }
  .tip-body { margin-top: 6px; line-height: 1.6; }
  .tip-body.hidden { display: none; }
  #tip-refresh { margin-top: 6px; font-size: 11px; color: #C08A2D; letter-spacing: 1px; display: inline-block; }
  .item-list .item-time { font-size: 10px; color: #B3A88F; flex-shrink: 0; }
  .item-del {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    font-size: 13px; color: #B3A88F; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .item-del:active { background: rgba(0,0,0,0.06); }
  .empty-tip { font-size: 11px; color: #C4BAA2; text-align: center; padding: 10px 0; letter-spacing: 1px; }

  /* 输入行 */
  .add-row { display: flex; gap: 6px; margin-top: 14px; align-items: center; }
  .add-row input {
    flex: 1; min-width: 0;
    background: transparent;
    border: none; border-bottom: 1px solid rgba(120, 110, 90, 0.3);
    padding: 7px 2px;
    font-size: clamp(12px, 3.3vw, 14px);
    outline: none;
  }
  .add-row input:focus { border-bottom-color: currentColor; }
  .col-high .add-row input:focus { border-bottom-color: #FF5A5F; }
  .col-down .add-row input:focus { border-bottom-color: #4A7BD0; }
  .add-btn {
    flex-shrink: 0; padding: 6px 12px; border-radius: 10px;
    font-size: 12px; letter-spacing: 1px; color: #FFFDF8;
  }
  .col-high .add-btn { background: #FF5A5F; }
  .col-down .add-btn { background: #4A7BD0; }

  /* ========== 弹层（日历 / 碎碎念 / 日期详情） ========== */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: #FAF6EE;
    display: none; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  .overlay.active { display: flex; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .overlay-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .overlay-title { font-size: 17px; font-weight: 600; letter-spacing: 2px; flex: 1; }

  /* ---- 日历 ---- */
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .cal-nav button { width: 34px; height: 34px; border-radius: 50%; background: #FFFDF8; border: 1px solid #EFE7D6; font-size: 15px; color: #5A5347; }
  #cal-month-label { font-size: 16px; font-weight: 600; letter-spacing: 1px; min-width: 130px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; max-width: 420px; margin: 0 auto; }
  .cal-week { text-align: center; font-size: 11px; color: #A79C86; padding: 6px 0; }
  .cal-cell {
    aspect-ratio: 1 / 1; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: #FFFDF8; border: 1px solid transparent;
    position: relative;
  }
  .cal-cell .num { font-size: clamp(11px, 3.2vw, 14px); color: #5A5347; }
  .cal-cell .mini {
    width: clamp(14px, 4vw, 20px); height: clamp(14px, 4vw, 20px);
    border-radius: 50%; background: #FFD84D;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .cal-cell.today { border-color: #E0B33C; background: #FFF7DF; }
  .cal-cell.today .num { font-weight: 700; }
  .cal-cell.empty { background: transparent; border: none; }
  .cal-legend { text-align: center; font-size: 11px; color: #A79C86; margin-top: 14px; letter-spacing: 1px; }

  /* ---- 日期详情 ---- */
  .day-section { margin-bottom: 18px; }
  .day-section h3 { font-size: 14px; letter-spacing: 2px; margin-bottom: 8px; }
  .day-section.sec-high h3 { color: #FF5A5F; }
  .day-section.sec-down h3 { color: #4A7BD0; }
  .day-section.sec-notes h3 { color: #C08A2D; }
  .day-list { list-style: none; }
  .day-list li {
    background: #FFFDF8; border: 1px solid #EFE7D6; border-radius: 12px;
    padding: 9px 12px; margin-bottom: 6px;
    font-size: 13px; line-height: 1.5; word-break: break-all;
  }
  .day-list .item-time { font-size: 10px; color: #B3A88F; margin-left: 6px; }
  .day-none { font-size: 12px; color: #C4BAA2; letter-spacing: 1px; }

  /* ---- 碎碎念 ---- */
  .note-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .note-input-row input {
    flex: 1; min-width: 0;
    background: #FFFDF8; border: 1px solid #EFE7D6; border-radius: 12px;
    padding: 10px 12px; font-size: 14px; outline: none;
  }
  .note-input-row input:focus { border-color: #E0B33C; }
  .note-input-row button {
    background: #FFD84D; border-radius: 12px; padding: 0 18px;
    font-size: 14px; font-weight: 600; color: #5A4A10;
  }
  .note-list { list-style: none; }
  .note-list li {
    display: flex; align-items: flex-start; gap: 8px;
    background: #FFFDF8; border: 1px solid #EFE7D6; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
    animation: fadeIn 0.25s ease;
  }
  .note-list .note-body { flex: 1; min-width: 0; }
  .note-list .note-text { font-size: 14px; line-height: 1.55; word-break: break-all; }
  .note-list .note-time { font-size: 11px; color: #B3A88F; margin-top: 4px; }
  .note-list .item-del { margin-top: 2px; }
</style>
<style id="__dm_no_drag_style__">* { -webkit-user-drag: none !important; }</style><style id="__dm_bindable_badge_style__">[data-sp-bindable="database"]{outline:1px dashed #0088ff;outline-offset:2px;border-radius:4px;}[data-sp-bindable="database"] *{pointer-events:none !important;transition:none !important;animation:none !important;}[data-sp-bindable="database"]{transition:none !important;animation:none !important;}</style></head>
<body>

<!-- ================= 主页 ================= -->
<div id="page-home" class="page active">
  <!-- 顶部两个入口：点击不触发圆圈跳转 -->
  <div class="entries">
    <button class="entry-card cal" id="btn-open-calendar"><span class="dot"></span>日历</button>
    <button class="entry-card note" id="btn-open-notes"><span class="dot"></span>碎碎念</button>
  </div>

  <div class="circle-wrap">
    <div class="greeting" id="greeting"></div>
    <div id="circle" title="点击记录今天">
      <div class="circle-inner">
        <div id="date-text">2026年10月24日 周六</div>
        <div id="count-line">High 8 · Down 0</div>
        <div id="daily-rec"></div>
      </div>
    </div>
    <div class="hint">点 击 圆 圈 记 录 今 天</div>
  </div>
</div>

<!-- ================= 今日记录页 ================= -->
<div id="page-record" class="page">
  <div class="record-header">
    <button class="back-btn" id="btn-back-home">←</button>
    <div class="record-title" id="record-date">2026年10月24日 周六</div>
  </div>
  <div class="tip-card" id="tip-card">
    <div class="tip-head">
      <span>✨ 今日小提示</span>
      <button id="tip-toggle">收起</button>
    </div>
    <div class="tip-body" id="tip-body">
      <span id="tip-text"></span>
      <button id="tip-refresh">换一条 ↻</button>
    </div>
  </div>
  <div class="future-card">
    <div class="future-label">✉️ 给未来的自己一句话</div>
    <div class="future-row">
      <input type="text" id="input-future" placeholder="写给未来的你…" maxlength="120">
      <button id="btn-future">存</button>
    </div>
    <div class="future-saved" id="future-saved"></div>
  </div>
  <div class="record-cols">
    <!-- 左：High 红色区 -->
    <section class="col col-high">
      <h2>High</h2>
      <div class="col-sub"></div>
      <ul class="item-list" id="list-high"><li class="empty-tip" style="border-bottom: none;">还没有记录</li></ul>
      <div class="add-row">
        <input type="text" id="input-high" placeholder="记一件开心的事…" maxlength="100">
        <button class="add-btn" data-type="high">添加</button>
      </div>
    </section>
    <!-- 右：Down 蓝色区 -->
    <section class="col col-down">
      <h2>Down</h2>
      <div class="col-sub" style="white-space: pre-wrap;"></div>
      <ul class="item-list" id="list-down"><li class="empty-tip" style="border-bottom: none;">还没有记录</li></ul>
      <div class="add-row">
        <input type="text" id="input-down" placeholder="记一件烦心的事…" maxlength="100">
        <button class="add-btn" data-type="down">添加</button>
      </div>
    </section>
  </div>
</div>

<!-- ================= 日历弹层 ================= -->
<div id="overlay-calendar" class="overlay">
  <div class="overlay-header">
    <button class="back-btn" data-close="overlay-calendar">←</button>
    <div class="overlay-title">日历</div>
  </div>
  <div class="cal-nav">
    <button id="cal-prev">‹</button>
    <div id="cal-month-label"></div>
    <button id="cal-next">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-legend">小圆 = 当天调和后的颜色 · 无记录为纯黄</div>
</div>

<!-- ================= 日期详情弹层 ================= -->
<div id="overlay-day" class="overlay">
  <div class="overlay-header">
    <button class="back-btn" data-close="overlay-day">←</button>
    <div class="overlay-title" id="day-title"></div>
  </div>
  <div class="day-section sec-high">
    <h3>High</h3>
    <ul class="day-list" id="day-high"></ul>
  </div>
  <div class="day-section sec-down">
    <h3>Down</h3>
    <ul class="day-list" id="day-down"></ul>
  </div>
  <div class="day-section sec-future" id="sec-future" style="display:none;">
    <h3>✉️ 给未来的自己</h3>
    <ul class="day-list"><li id="day-future"></li></ul>
  </div>
  <div class="day-section sec-notes">
    <h3>碎碎念</h3>
    <ul class="day-list" id="day-notes"></ul>
  </div>
</div>

<!-- ================= 碎碎念弹层 ================= -->
<div id="overlay-notes" class="overlay">
  <div class="overlay-header">
    <button class="back-btn" data-close="overlay-notes">←</button>
    <div class="overlay-title">碎碎念</div>
  </div>
  <div class="note-input-row">
    <input type="text" id="input-note" placeholder="随便写点什么…" maxlength="200">
    <button id="btn-add-note">保存</button>
  </div>
  <ul class="note-list" id="note-list"></ul>
</div>

<script>
/* =====================================================
 * 今日色环 / Daily Color Circle
 * 单文件应用：主页圆圈（三原色调和）+ 记录页 + 日历 + 碎碎念
 * 数据全部保存在 localStorage，无外部依赖
 * ===================================================== */

/* ---------- 颜色常量（RGB） ---------- */
const BASE_YELLOW = [255, 216, 77];  // #FFD84D 基础黄，权重固定参与
const HIGH_RED    = [255, 90, 95];   // #FF5A5F High 红
const DOWN_BLUE   = [74, 123, 208];  // #4A7BD0 Down 蓝

/* ---------- 每日推荐内容库 ----------
 * 格式：[类型, 标题, 一句推荐语]
 * 可直接在数组末尾追加条目，无需改动任何逻辑；
 * 当天推荐首次生成后已固化在 localStorage，新增内容只影响未来日期。
 * ------------------------------------ */
const DAILY_CONTENT = [
  // —— 书 ——
  ["书", "《小王子》", "今天也记得看看心里的那朵玫瑰。"],
  ["书", "《挪威的森林》", "每个人都有属于自己的一片森林。"],
  ["书", "《边城》", "去沈从文笔下的湘西，等一艘渡船。"],
  ["书", "《目送》", "有些路啊，只能一个人走。"],
  ["书", "《解忧杂货店》", "认真回信的人，也在被生活温柔回答。"],
  ["书", "《山茶文具店》", "替人写信的人，最懂字里的人情。"],
  ["书", "《蛤蟆先生去看心理医生》", "允许自己今天只是普通地好起来。"],

  let g;
  if (h < 5)       g = "夜深了，也记得早点休息。";
  else if (h < 11) g = "早安，今天也要好好照顾自己。";
  else if (h < 14) g = "中午好，吃顿舒服的饭吧。";
  else if (h < 18) g = "下午好，喝口水、缓一缓。";
  else             g = "晚上好，今天辛苦啦。";
  const sp = SPECIAL_DAYS.find(s => s.m === now.getMonth() + 1 && s.d === now.getDate());
  if (sp) g += " 今天是" + sp.name + "，" + sp.wish;
  else if (now.getDay() === 0 || now.getDay() === 6) g += " 周末愉快，做点让自己开心的事。";
  return g;
}

/** 按 High/Down 情况分 6 档 */
function tipCategory(highN, downN) {
  if (highN === 0 && downN === 0) return "none";
  if (highN - downN >= 2 && highN >= 2) return "highBig";
  if (downN - highN >= 2 && downN >= 2) return "downBig";
  if (highN > downN) return "highWin";
  if (downN > highN) return "downWin";
  return "balanced";
}
function randomTip(highN, downN) {
  const arr = TIP_POOL[tipCategory(highN, downN)];
  return arr[Math.floor(Math.random() * arr.length)];
}
/** 关键词对症建议：命中当天 Down 文字里的关键词，返回对应一条；无命中返回 null */
function keywordTip(downItems) {
  const text = downItems.map(i => i.text).join(" ");
  const matched = KEYWORD_TIPS.filter(g => g.keys.some(k => text.includes(k)));
  if (!matched.length) return null;
  const g = matched[Math.floor(Math.random() * matched.length)];
  return g.tips[Math.floor(Math.random() * g.tips.length)];
}

/** 今日小提示渲染：优先关键词对症建议，否则按 up/down 档位随机；仅在“档位/命中变化”或强制时换一条 */
let tipLastCat = null;
function renderTip(force) {
  const rec = getDay(currentDay);
  const kw = keywordTip(rec.down);
  const cat = (kw ? "kw" : "cat") + ":" + tipCategory(rec.high.length, rec.down.length);
  if (force || cat !== tipLastCat) {
    $("tip-text").textContent = kw || randomTip(rec.high.length, rec.down.length);
    tipLastCat = cat;
  }
}

/* ---------- localStorage 封装 ----------
 * 统一用安全读写：某些环境（file://、隐私模式、配额满）下 localStorage
 * 可能抛错，必须 try/catch 兜底，否则会打断添加/删除/渲染流程。
 * --------------------------------------- */
const STORE_KEY = "dcc_data_v1";           // 记录数据
const REC_PREFIX = "dcc_rec_";             // 每日推荐固化 key 前缀

/** 安全读取：失败返回 null（调用方需处理无值情况） */
function lsGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
/** 安全写入：失败静默忽略，至少保证内存中的 UI 仍然正常 */
function lsSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) { /* 忽略：存储不可用时仅内存生效 */ }
}

/** 读取全部记录数据：{ "YYYY-MM-DD": { high:[], down:[], notes:[] } } */
function loadData() {
  const raw = lsGet(STORE_KEY);
  try { return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
}
let store = loadData();
function saveStore() { lsSet(STORE_KEY, JSON.stringify(store)); }

/** 取某天的数据结构（只读场景不会创建空记录） */
function getDay(dk) {
  return store[dk] || { high: [], down: [], notes: [] };
}
/** 取或创建某天的数据结构（写入场景） */
function ensureDay(dk) {
  if (!store[dk]) store[dk] = { high: [], down: [], notes: [] };
  return store[dk];
}
/** 生成简易唯一 id */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ---------- 日期工具 ---------- */
const WEEK_CN = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const pad = n => String(n).padStart(2, "0");
/** Date -> "YYYY-MM-DD" */
function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
/** "YYYY-MM-DD" -> "2026年10月24日 周六" */
function dateCN(dk) {
  const [y, m, d] = dk.split("-").map(Number);
  const w = WEEK_CN[new Date(y, m - 1, d).getDay()];
  return `${y}年${m}月${d}日 ${w}`;
}
/** "YYYY-MM-DD" -> "10月24日" */
function dateShort(dk) {
  const [, m, d] = dk.split("-").map(Number);
  return `${m}月${d}日`;
}
/** 当前时间 "21:30" */
function nowTime() {
  const n = new Date();
  return pad(n.getHours()) + ":" + pad(n.getMinutes());
}

/* ---------- 颜色调和 ----------
 * 黄色权重 = High 条数 + Down 条数 + 3（始终最高，保证色调柔和）
 * 红色权重 = High 条数；蓝色权重 = Down 条数
 * 最终颜色 = 三色按权重的 RGB 加权平均
 * -------------------------------------- */
/* 颜色调和（中 ×1.6）：
 * 黄底权重 = High + Down + 2；每条 High 红权重 ×1.6，每条 Down 蓝权重 ×1.6。
 * 记录越多越敢偏离黄（High→橙、Down→绿/灰、都有→棕），有黄底+亮度约束不会变纯红/纯蓝。
 * 说明：纯 High/纯 Down 较多时，红或蓝权重会略高于黄（这是“颜色更分明”的必然取舍）。 */
const MIX_MUL = 1.6;
function mixedColor(highCount, downCount) {
  const wY = highCount + downCount + 2;
  const wR = highCount * MIX_MUL;
  const wB = downCount * MIX_MUL;
  const total = wY + wR + wB;
  const r = Math.round((BASE_YELLOW[0] * wY + HIGH_RED[0] * wR + DOWN_BLUE[0] * wB) / total);
  const g = Math.round((BASE_YELLOW[1] * wY + HIGH_RED[1] * wR + DOWN_BLUE[1] * wB) / total);
  const b = Math.round((BASE_YELLOW[2] * wY + HIGH_RED[2] * wR + DOWN_BLUE[2] * wB) / total);
  return [r, g, b];
}
function rgbStr(c) { return `rgb(${c[0]}, ${c[1]}, ${c[2]})`; }

/** 计算相对亮度，决定文字用黑还是白 */
function luminance(c) {
  const f = v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
/** 计算 HSL 饱和度（0~1），用于颜色取名 */
function saturation(c) {
  const mx = Math.max(c[0], c[1], c[2]) / 255;
  const mn = Math.min(c[0], c[1], c[2]) / 255;
  const l = (mx + mn) / 2;
  if (mx === mn) return 0;
  return l > 0.5 ? (mx - mn) / (2 - mx - mn) : (mx - mn) / (mx + mn);
}
/** 给当天调和色起一个温柔的名字（由 High/Down 情况决定，同一天稳定不变） */
function colorName(highCount, downCount) {
  if (highCount === 0 && downCount === 0) return "暖黄";
  const c = mixedColor(highCount, downCount);
  const S = saturation(c);
  const total = highCount + downCount;
  if (S < 0.13) return "暖灰";                                   // 很淡/发灰
  if (highCount > downCount)  return total <= 2 ? "蜜橘" : (total <= 5 ? "暖橙" : "落日");
  if (downCount > highCount)  return total <= 2 ? "初芽" : (total <= 5 ? "苔绿" : "湖水绿");
  return S < 0.2 ? "陶土" : (total <= 3 ? "焦糖" : "栗棕");      // High/Down 持平
}

/* ---------- 每日推荐 ----------
 * 用日期字符串哈希选一条；首次选出后固化到 localStorage，
 * 保证当天刷新不变，且以后扩充内容库不会让当天推荐跳变。
 * ------------------------------------ */
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function getDailyRec(dk) {
  const key = REC_PREFIX + dk;
  let idx = parseInt(lsGet(key), 10);
  if (isNaN(idx) || idx < 0 || idx >= DAILY_CONTENT.length) {
    idx = hashStr(dk) % DAILY_CONTENT.length;
    lsSet(key, String(idx)); // 固化当天推荐，刷新不变；扩充内容库只影响未来日期
  }
  const [type, title, note] = DAILY_CONTENT[idx];
  return `【${type}】${title} —— ${note}`;
}

/* ---------- DOM 引用 ---------- */
const $ = id => document.getElementById(id);
const today = () => dateKey(new Date());
const HOME = $("page-home"), RECORD = $("page-record");
const circle = $("circle"), dateText = $("date-text"), countLine = $("count-line"), dailyRecEl = $("daily-rec");
let currentDay = today(); // 当前正在查看/编辑的日期（主页始终为今天）

/* ---------- 主页渲染 ---------- */
function renderHome() {
  currentDay = today();
  const dk = currentDay;
  const day = getDay(dk);
  const color = mixedColor(day.high.length, day.down.length);

  dateText.textContent = dateCN(dk);
  countLine.textContent = `High ${day.high.length} · Down ${day.down.length} · ${colorName(day.high.length, day.down.length)}`;
  dailyRecEl.textContent = getDailyRec(dk);
  $("greeting").textContent = getGreeting();

  // 圆圈颜色 + 文字黑白自适应（0.18 为黑/白对比度临界点，取对比更高的一方）
  circle.style.backgroundColor = rgbStr(color);
  const light = luminance(color) > 0.18; // 背景够亮 -> 用深色文字
  const textColor = light ? "#3A3630" : "#FFFDF8";
  circle.style.color = textColor;
  // 阴影随颜色轻微变化
  circle.style.boxShadow = `0 10px 34px ${light ? "rgba(180,165,120,0.35)" : "rgba(0,0,0,0.28)"}`;
}

/** 渲染某一侧（high/down）的事项列表（含编辑 / 批注 / Down 自查） */
function renderItemList(type) {
  const listEl = $(type === "high" ? "list-high" : "list-down");
  const items = getDay(currentDay)[type];
  listEl.innerHTML = "";
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "empty-tip";
    li.style.borderBottom = "none";
    li.textContent = "还没有记录";
    listEl.appendChild(li);
    return;
  }
  const isDown = type === "down";
  items.forEach(it => {
    const li = document.createElement("li");

    // 主行：文本 + 时间 + 编辑 + 删除
    const main = document.createElement("div");
    main.className = "item-main";
    const span = document.createElement("span");
    span.className = "item-text";
    span.textContent = it.text;
    const time = document.createElement("span");
    time.className = "item-time";
    time.textContent = it.time;
    const editBtn = document.createElement("button");
    editBtn.className = "item-edit";
    editBtn.textContent = "✎";
    editBtn.title = "编辑";
    const del = document.createElement("button");
    del.className = "item-del";
    del.textContent = "×";
    del.title = "删除";
    del.addEventListener("click", () => removeItem(type, it.id));
    main.append(span, time, editBtn, del);

    // 已有批注展示
    const annoTip = document.createElement("div");
    annoTip.className = "anno-show";
    if (it.anno) annoTip.textContent = "📝 " + it.anno;
    else annoTip.hidden = true;

    // 操作行：批注（Down 再加“自查”）
    const actions = document.createElement("div");
    actions.className = "item-actions";
    const annoBtn = document.createElement("button");
    annoBtn.className = "anno-btn";
    annoBtn.textContent = it.anno ? "已批注 · 改" : "批注";
    actions.appendChild(annoBtn);

    // 编辑框（默认隐藏）：改事项文字
    const editBox = document.createElement("div");
    editBox.className = "edit-box hidden";
    const editInput = document.createElement("input");
    editInput.type = "text";
    editInput.maxLength = 100;
    editInput.value = it.text;
    const editSave = document.createElement("button");
    editSave.className = "anno-save";
    editSave.textContent = "保存";
    editBox.append(editInput, editSave);
    editBtn.addEventListener("click", () => {
      const willShow = editBox.classList.toggle("hidden");
      if (!willShow) editInput.focus();
    });
    editSave.addEventListener("click", () => editItem(type, it.id, editInput.value.trim()));

    // 批注框（默认隐藏）
    const annoBox = document.createElement("div");
    annoBox.className = "anno-box hidden";
    const annoInput = document.createElement("input");
    annoInput.type = "text";
    annoInput.placeholder = "加个批注…";
    annoInput.maxLength = 120;
    annoInput.value = it.anno || "";
    const annoSave = document.createElement("button");
    annoSave.className = "anno-save";
    annoSave.textContent = "保存";
    annoBox.append(annoInput, annoSave);
    annoBtn.addEventListener("click", () => {
      const willShow = annoBox.classList.toggle("hidden");
      if (!willShow) annoInput.focus();
    });
    annoSave.addEventListener("click", () => setAnno(type, it.id, annoInput.value.trim()));

    li.append(main, annoTip, actions, editBox, annoBox);

    // Down 专属：自查小清单（可勾选，勾选状态随记录保存）
    if (isDown) {
      const checkBtn = document.createElement("button");
      checkBtn.className = "check-btn";
      checkBtn.textContent = "自查 ▾";
      actions.appendChild(checkBtn);

      const checkBox = document.createElement("div");
      checkBox.className = "check-box hidden";
      const checklist = it.checklist || {};
      SELF_CHECK.forEach(label => {
        const row = document.createElement("label");
        row.className = "check-row";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!checklist[label];
        cb.addEventListener("change", () => setCheck(type, it.id, label, cb.checked));
        const txt = document.createElement("span");
        txt.textContent = label;
        row.append(cb, txt);
        checkBox.appendChild(row);
      });
      checkBtn.addEventListener("click", () => checkBox.classList.toggle("hidden"));
      li.append(checkBox);
    }

    listEl.appendChild(li);
  });
}

/** 添加一条 High/Down 事项 */
function addItem(type, text) {
  text = text.trim();
  if (!text) return;
  const day = ensureDay(currentDay);
  const item = { id: uid(), text, time: nowTime(), anno: "" };
  if (type === "down") item.checklist = {}; // Down 才有自查清单
  day[type].push(item);
  saveStore();
  renderItemList(type);
  // 实时重算主页圆圈颜色（虽然主页此刻不可见，返回后即为最新）
  renderHome();
  renderTip(); // up/down 数量变化，必要时更新提示档位
}
/** 删除一条事项 */
function removeItem(type, id) {
  const day = getDay(currentDay);
  day[type] = day[type].filter(it => it.id !== id);
  store[currentDay] = day; // 保留空数组结构，颜色自然回退
  saveStore();
  renderItemList(type);
  renderHome();
  renderTip();
}
/** 编辑某条事项的文字 */
function editItem(type, id, text) {
  if (!text) return;
  const day = getDay(currentDay);
  const it = day[type].find(x => x.id === id);
  if (it) { it.text = text; saveStore(); }
  renderItemList(type);
}
/** 更新某条事项的批注 */
function setAnno(type, id, text) {
  const day = getDay(currentDay);
  const it = day[type].find(x => x.id === id);
  if (it) { it.anno = text; saveStore(); }
  renderItemList(type);
}
/** 更新某条 Down 事项自查清单某一项的勾选状态 */
function setCheck(type, id, label, val) {
  const day = getDay(currentDay);
  const it = day[type].find(x => x.id === id);
  if (it) { it.checklist = it.checklist || {}; it.checklist[label] = val; saveStore(); }
}
/** 保存“给未来的自己一句话” */
function setFuture(text) {
  text = text.trim();
  ensureDay(currentDay).future = text;
  saveStore();
  $("future-saved").textContent = text ? "✉️ " + text : "";
}

/* 记录页输入与按钮绑定 */
$("input-high").addEventListener("keydown", e => {
  if (e.key === "Enter") { addItem("high", e.target.value); e.target.value = ""; e.target.focus(); }
});
$("input-down").addEventListener("keydown", e => {
  if (e.key === "Enter") { addItem("down", e.target.value); e.target.value = ""; e.target.focus(); }
});
document.querySelectorAll(".add-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.dataset.type;
    const input = $(type === "high" ? "input-high" : "input-down");
    addItem(type, input.value);
    input.value = "";
    input.focus();
  });
});

/* ---------- 日历 ---------- */
let calYear, calMonth; // 日历当前显示的年月（month: 0-11）
function openCalendar() {
  const n = new Date();
  calYear = n.getFullYear();
  calMonth = n.getMonth();
  renderCalendar();
  openOverlay("overlay-calendar");
}
/** 渲染月历：周一为一周开始 */
function renderCalendar() {
  $("cal-month-label").textContent = `${calYear}年${calMonth + 1}月`;
  const grid = $("cal-grid");
  grid.innerHTML = "";

  // 星期表头
  ["一", "二", "三", "四", "五", "六", "日"].forEach(w => {
    const d = document.createElement("div");
    d.className = "cal-week";
    d.textContent = w;
    grid.appendChild(d);
  });

  const firstDay = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  // 周一开头的偏移：JS getDay() 周日=0 -> 转为周一=0
  let lead = (firstDay.getDay() + 6) % 7;
  const todayKey = today();

  for (let i = 0; i < lead; i++) {
    const d = document.createElement("div");
    d.className = "cal-cell empty";
    grid.appendChild(d);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dk = `${calYear}-${pad(calMonth + 1)}-${pad(day)}`;
    const rec = getDay(dk);
    const color = mixedColor(rec.high.length, rec.down.length);

    const cell = document.createElement("button");
    cell.className = "cal-cell" + (dk === todayKey ? " today" : "");
    const num = document.createElement("div");
    num.className = "num";
    num.textContent = day;
    const mini = document.createElement("div");
    mini.className = "mini";
    mini.style.backgroundColor = rgbStr(color);
    cell.append(num, mini);

    // 点击查看该天摘要
    cell.addEventListener("click", () => { openDayDetail(dk); });
    grid.appendChild(cell);
  }
}
$("cal-prev").addEventListener("click", () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
$("cal-next").addEventListener("click", () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

/* ---------- 碎碎念 ---------- */

/** 渲染碎碎念列表（按时间倒序） */
function renderNotes() {
  const ul = $("note-list");
  ul.innerHTML = "";
  // 汇总所有日期的碎碎念并倒序排列（datetime 字符串可直接比较）
  const all = [];
  Object.keys(store).forEach(dk => {
    (store[dk].notes || []).forEach(n => all.push(n));
  });
  all.sort((a, b) => b.datetime.localeCompare(a.datetime));

  if (!all.length) {
    const li = document.createElement("li");
    li.innerHTML = '<span class="day-none" style="background:none;border:none;padding:0;">还没有碎碎念，写一条吧。</span>';
    ul.appendChild(li);
    return;
  }
  all.forEach(n => {
    const li = document.createElement("li");
    const body = document.createElement("div");
    body.className = "note-body";
    const text = document.createElement("div");
    text.className = "note-text";
    text.textContent = n.text;
    const time = document.createElement("div");
    time.className = "note-time";
    time.textContent = n.datetime;
    body.append(text, time);
    const del = document.createElement("button");
    del.className = "item-del";
    del.textContent = "×";
    del.addEventListener("click", () => removeNote(n.id));
    li.append(body, del);
    ul.appendChild(li);
  });
}
/** 新增碎碎念：保存到当天的 notes，记录日期+时间 */
function addNote(text) {
  text = text.trim();
  if (!text) return;
  const dk = today();
  ensureDay(dk).notes.push({
    id: uid(),
    text,
    datetime: `${dk} ${nowTime()}`  // "2026-10-24 21:32"
  });
  saveStore();
  renderNotes();
}
/** 删除碎碎念（在任意日期里查找） */
function removeNote(id) {
  Object.keys(store).forEach(dk => {
    store[dk].notes = (store[dk].notes || []).filter(n => n.id !== id);
  });
  saveStore();
  renderNotes();
}
$("btn-add-note").addEventListener("click", () => {
  const input = $("input-note");
  addNote(input.value);
  input.value = "";
  input.focus();
});
$("input-note").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    addNote(e.target.value);
    e.target.value = "";
  }
});

/* ---------- 事件绑定 ---------- */
// 点击圆圈进入记录页
circle.addEventListener("click", openRecord);
// 返回主页
$("btn-back-home").addEventListener("click", () => { renderHome(); showPage("page-home"); });
// 顶部入口卡片（与圆圈互不影响）
$("btn-open-calendar").addEventListener("click", openCalendar);
$("btn-open-notes").addEventListener("click", openNotes);
// 弹层关闭按钮
document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", () => closeOverlay(btn.dataset.close));
});
// 今日小提示：收起/展开 + 换一条随机
$("tip-toggle").addEventListener("click", toggleTip);
$("tip-refresh").addEventListener("click", () => {
  const rec = getDay(currentDay);
  // 换一条：有命中关键词就在该组里换，否则按档位重新随机
  $("tip-text").textContent = keywordTip(rec.down) || randomTip(rec.high.length, rec.down.length);
});
// 给未来的自己一句话：保存（按钮或回车）
$("btn-future").addEventListener("click", () => setFuture($("input-future").value));
$("input-future").addEventListener("keydown", e => {
  if (e.key === "Enter") setFuture(e.target.value);
});

/* ---------- 启动 ---------- */
renderHome();
