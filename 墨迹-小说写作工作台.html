<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨迹 · 长篇小说写作工作台</title>
<style>
:root{
  --ink:#1c1a17;
  --ink-2:#3d3933;
  --ink-3:#6b655c;
  --ink-4:#9a938a;
  --paper:#faf8f4;
  --paper-2:#f3efe7;
  --paper-3:#e8e2d6;
  --line:#e0d9cc;
  --line-2:#d3cabb;
  --accent:#a8442a;
  --accent-2:#c25a3c;
  --accent-soft:#f5e6e0;
  --jade:#3f6b58;
  --jade-soft:#e4ede8;
  --gold:#b08a3e;
  --gold-soft:#f6efdd;
  --shadow-sm:0 1px 2px rgba(40,33,24,.06),0 1px 1px rgba(40,33,24,.04);
  --shadow-md:0 4px 14px rgba(40,33,24,.08),0 1px 3px rgba(40,33,24,.05);
  --shadow-lg:0 18px 48px rgba(30,25,18,.16),0 2px 8px rgba(30,25,18,.06);
  --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
  --sans:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  --editor-font:var(--serif);
  --editor-size:17px;
  --editor-lh:2;
  --r:10px;
}
[data-theme="dark"]{
  --ink:#e8e3d9;
  --ink-2:#cdc6b9;
  --ink-3:#a49c8f;
  --ink-4:#7a7367;
  --paper:#191817;
  --paper-2:#21201e;
  --paper-3:#2b2926;
  --line:#332f2a;
  --line-2:#413b34;
  --accent:#d4704f;
  --accent-2:#e08b6c;
  --accent-soft:#3a2520;
  --jade:#6fa78d;
  --jade-soft:#1f2b26;
  --gold:#c9a45c;
  --gold-soft:#2e2820;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 18px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-soft);color:var(--ink)}
[data-theme="dark"] ::selection{background:#5a3326;color:#fff}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}

/* ============ 布局 ============ */
#app{display:flex;height:100vh;width:100vw;overflow:hidden}

/* ---- 左侧栏 ---- */
#sidebar{
  width:268px;flex:0 0 268px;
  background:var(--paper-2);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:margin-left .26s cubic-bezier(.4,0,.2,1),opacity .2s;
  z-index:30;
}
#sidebar.hidden{margin-left:-268px;opacity:0;pointer-events:none}
.brand{
  padding:16px 16px 12px;display:flex;align-items:center;gap:9px;
}
.brand-mark{
  width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:linear-gradient(145deg,var(--accent),#7d2f1b);
  display:grid;place-items:center;color:#fff;
  font-family:var(--serif);font-size:16px;font-weight:700;
  box-shadow:0 2px 6px rgba(168,68,42,.3);
}
.brand-txt{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.brand-sub{font-size:10px;color:var(--ink-4);letter-spacing:.8px;margin-top:2px;font-weight:400}
.brand-actions{margin-left:auto;display:flex;gap:2px}

.side-search{padding:0 12px 10px;position:relative}
.side-search input{
  width:100%;padding:7px 10px 7px 30px;border-radius:8px;
  background:var(--paper);border:1px solid var(--line);
  font-size:12.5px;outline:none;transition:.15s;
}
.side-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.side-search svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--ink-4);pointer-events:none}

.nav-tabs{display:flex;padding:0 12px 8px;gap:2px}
.nav-tab{
  flex:1;padding:6px 0;font-size:12px;color:var(--ink-3);
  border-radius:7px;transition:.15s;text-align:center;font-weight:500;
}
.nav-tab:hover{background:var(--paper-3);color:var(--ink-2)}
.nav-tab.on{background:var(--paper);color:var(--accent);font-weight:600;box-shadow:var(--shadow-sm)}

.side-body{flex:1;overflow-y:auto;padding:0 8px 14px}
.side-foot{
  border-top:1px solid var(--line);padding:9px 12px;
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-4);
}

/* 章节树 */
.vol-head{
  display:flex;align-items:center;gap:5px;padding:8px 8px 6px;
  font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.6px;
  cursor:pointer;user-select:none;
}
.vol-head .chev{transition:transform .2s;display:grid;place-items:center}
.vol-head.collapsed .chev{transform:rotate(-90deg)}
.vol-head:hover{color:var(--ink)}
.vol-head .vol-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol-head .vol-count{font-weight:400;color:var(--ink-4);font-size:10.5px}
.vol-head .vol-add{opacity:0;transition:.15s;padding:2px;border-radius:4px}
.vol-head:hover .vol-add{opacity:1}
.vol-head .vol-add:hover{background:var(--paper-3);color:var(--accent)}

.ch-item{
  display:flex;align-items:center;gap:7px;
  padding:7px 8px 7px 22px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--ink-2);margin-bottom:1px;
  transition:background .12s;position:relative;
}
.ch-item:hover{background:var(--paper-3)}
.ch-item.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.ch-item.on::before{
  content:"";position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:3px;height:14px;border-radius:2px;background:var(--accent);
}
.ch-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-item .ch-wc{font-size:10px;color:var(--ink-4);font-weight:400;flex:0 0 auto}
.ch-item .ch-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:0 0 5px}
.ch-item .ch-more{opacity:0;padding:2px;border-radius:4px;flex:0 0 auto}
.ch-item:hover .ch-more{opacity:1}
.ch-item .ch-more:hover{background:var(--line)}

.drop-line{height:2px;background:var(--accent);border-radius:2px;margin:1px 6px;display:none}
.ch-item.dragging{opacity:.4}
.ch-item[data-drop="before"]{box-shadow:0 -2px 0 var(--accent)}
.ch-item[data-drop="after"]{box-shadow:0 2px 0 var(--accent)}

.empty-hint{
  text-align:center;padding:32px 16px;color:var(--ink-4);font-size:12.5px;line-height:1.9;
}
.empty-hint b{color:var(--ink-3);font-weight:600}

/* 设定列表 */
.ent-group{margin-bottom:4px}
.ent-group-head{
  display:flex;align-items:center;gap:6px;padding:9px 8px 5px;
  font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.6px;
}
.ent-group-head .line{flex:1;height:1px;background:var(--line)}
.ent-group-head .cnt{font-weight:400;color:var(--ink-4)}
.ent-item{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
  cursor:pointer;font-size:13px;transition:.12s;color:var(--ink-2);
}
.ent-item:hover{background:var(--paper-3)}
.ent-item.on{background:var(--paper);box-shadow:var(--shadow-sm);color:var(--ink);font-weight:600}
.ent-avatar{
  width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:#fff;font-family:var(--serif);
}
.ent-avatar.sq{border-radius:6px}
.ent-item .ent-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent-item .ent-tag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--paper-3);color:var(--ink-4);font-weight:400}
.side-add{
  display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;
  color:var(--ink-4);font-size:12.5px;width:100%;transition:.12s;margin-top:2px;
}
.side-add:hover{background:var(--paper-3);color:var(--accent)}

/* ---- 主区 ---- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--paper)}

.topbar{
  height:50px;flex:0 0 50px;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--line);background:var(--paper);
  z-index:20;
}
.icon-btn{
  width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  color:var(--ink-3);transition:.13s;flex:0 0 auto;
}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn:disabled:hover{background:none;color:var(--ink-3)}
.tb-div{width:1px;height:18px;background:var(--line);margin:0 2px}
.tb-title{
  flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;
}
.tb-title h1{
  font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none;
  padding:1px 4px;border-radius:4px;margin-left:-4px;
}
.tb-title h1:focus{background:var(--paper-2);box-shadow:0 0 0 1px var(--line-2)}
.tb-meta{font-size:10.5px;color:var(--ink-4);display:flex;gap:8px;padding-left:0}
.tb-meta .save-flash{color:var(--jade);opacity:0;transition:opacity .3s}
.tb-meta .save-flash.show{opacity:1}

.wordcount{
  display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:7px;
  background:var(--paper-2);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.wordcount b{color:var(--ink);font-weight:700;font-size:12.5px}
.wc-ring{width:16px;height:16px;flex:0 0 16px}
.wc-ring circle{fill:none;stroke-width:2.4}
.wc-ring .bg{stroke:var(--line-2)}
.wc-ring .fg{stroke:var(--jade);stroke-linecap:round;transition:stroke-dashoffset .4s}

/* 编辑器区 */
.editor-wrap{flex:1;overflow-y:auto;position:relative;scroll-behavior:smooth}
.editor-inner{max-width:720px;margin:0 auto;padding:44px 40px 40vh}
#editor{
  width:100%;border:none;outline:none;resize:none;
  font-family:var(--editor-font);font-size:var(--editor-size);
  line-height:var(--editor-lh);color:var(--ink);background:transparent;
  letter-spacing:.02em;min-height:60vh;
  text-align:justify;
}
#editor::placeholder{color:var(--ink-4);opacity:.65}
#editor[readonly]{opacity:.72;cursor:default}

/* 打字机模式 */
.typing-mode .editor-inner{padding-bottom:52vh}
.typing-focus-line{
  position:absolute;left:0;right:0;height:calc(var(--editor-size) * var(--editor-lh));
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  pointer-events:none;display:none;z-index:1;opacity:.55;
}
.typing-mode .typing-focus-line{display:block}

/* 空状态 */
.welcome{
  max-width:560px;margin:0 auto;padding:76px 32px;text-align:center;
}
.welcome h2{font-family:var(--serif);font-size:26px;font-weight:700;margin-bottom:10px;letter-spacing:1px}
.welcome p{color:var(--ink-3);font-size:13.5px;line-height:2;margin-bottom:28px}
.welcome .quote{
  font-family:var(--serif);font-size:15px;color:var(--ink-3);font-style:italic;
  padding:16px 20px;border-left:2px solid var(--line-2);text-align:left;margin-bottom:30px;
  background:var(--paper-2);border-radius:0 8px 8px 0;
}
.welcome-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;text-align:left}
.w-card{
  padding:14px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper-2);cursor:pointer;transition:.16s;
}
.w-card:hover{border-color:var(--accent);background:var(--paper);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.w-card .wc-t{font-weight:600;font-size:13px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.w-card .wc-d{font-size:11.5px;color:var(--ink-4);line-height:1.6}

/* ---- 右侧面板 ---- */
#inspector{
  width:308px;flex:0 0 308px;background:var(--paper-2);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  transition:margin-right .26s cubic-bezier(.4,0,.2,1),opacity .2s;z-index:20;
}
#inspector.hidden{margin-right:-308px;opacity:0;pointer-events:none}
.insp-tabs{display:flex;padding:9px 10px 0;gap:1px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.insp-tab{
  padding:6px 8px 8px;font-size:11.5px;color:var(--ink-4);font-weight:500;
  border-bottom:2px solid transparent;transition:.13s;white-space:nowrap;
}
.insp-tab:hover{color:var(--ink-2)}
.insp-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.insp-body{flex:1;overflow-y:auto;padding:14px 12px 20px}
.insp-sec{margin-bottom:18px}
.insp-sec-t{
  font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--ink-4);
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.insp-sec-t .line{flex:1;height:1px;background:var(--line)}

.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--ink-4);margin-bottom:4px;font-weight:500}
.field input,.field textarea,.field select{
  width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--paper);outline:none;font-size:12.5px;transition:.14s;line-height:1.6;
}
.field textarea{resize:vertical;min-height:64px;font-family:var(--sans)}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}

.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-size:11px;padding:3px 8px;border-radius:12px;background:var(--paper-3);
  color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;
}
.tag .x{opacity:.5;cursor:pointer;font-size:12px;line-height:1}
.tag .x:hover{opacity:1;color:var(--accent)}

/* 人物关系图 */
.rel-graph{
  position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:8px;margin-bottom:10px;
}
.rel-node{cursor:pointer}
.rel-item{
  display:flex;align-items:center;gap:7px;font-size:11.5px;
  padding:5px 0;color:var(--ink-2);
}
.rel-item .rel-type{font-size:10px;color:var(--ink-4);margin-left:auto}

/* 线索 */
.thread-card{
  border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;
  background:var(--paper);transition:.14s;
}
.thread-card:hover{box-shadow:var(--shadow-sm)}
.thread-card .th-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.thread-card .th-name{font-weight:600;font-size:12.5px;flex:1}
.thread-card .th-desc{font-size:11.5px;color:var(--ink-3);line-height:1.7}
.thread-card .th-chs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.th-chip{
  font-size:10px;padding:2px 6px;border-radius:4px;background:var(--paper-3);
  color:var(--ink-3);cursor:pointer;
}
.th-chip:hover{background:var(--accent-soft);color:var(--accent)}
.badge{
  font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.3px;
}
.badge.open{background:var(--gold-soft);color:var(--gold)}
.badge.done{background:var(--jade-soft);color:var(--jade)}
.badge.drop{background:var(--paper-3);color:var(--ink-4)}

/* 出场人物 chips */
.cast-chips{display:flex;flex-wrap:wrap;gap:5px}
.cast-chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:14px;
  font-size:11.5px;cursor:pointer;transition:.13s;
  background:var(--paper);border:1px solid var(--line);color:var(--ink-2);
}
.cast-chip:hover{border-color:var(--accent);color:var(--accent)}
.cast-chip .av{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:8px;color:#fff;font-weight:700}
.cast-chip .rm{opacity:.4;margin-left:2px}
.cast-chip .rm:hover{opacity:1;color:var(--accent)}

/* 参考素材 */
.ref-item{
  font-size:11.5px;padding:8px 10px;border-radius:7px;background:var(--paper);
  border:1px solid var(--line);margin-bottom:6px;line-height:1.7;color:var(--ink-2);
  cursor:pointer;transition:.13s;
}
.ref-item:hover{border-color:var(--accent)}
.ref-item .ref-src{font-size:10px;color:var(--ink-4);margin-top:3px}

/* ---- 底部状态栏 ---- */
.statusbar{
  height:28px;flex:0 0 28px;display:flex;align-items:center;gap:14px;
  padding:0 14px;border-top:1px solid var(--line);background:var(--paper-2);
  font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;
}
.statusbar .sb-item{display:flex;align-items:center;gap:4px}
.statusbar .sb-sp{flex:1}
.statusbar .sb-btn{padding:2px 6px;border-radius:4px}
.statusbar .sb-btn:hover{background:var(--paper-3);color:var(--ink-2)}
.statusbar .sb-btn.on{color:var(--accent);font-weight:600}

/* ---- 弹窗 ---- */
.modal-mask{
  position:fixed;inset:0;background:rgba(24,20,15,.42);backdrop-filter:blur(2px);
  z-index:100;display:none;place-items:center;padding:24px;
  animation:fadeIn .16s ease;
}
.modal-mask.show{display:grid}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal{
  background:var(--paper);border-radius:14px;box-shadow:var(--shadow-lg);
  width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;
  animation:popIn .2s cubic-bezier(.2,.8,.3,1);border:1px solid var(--line);
}
.modal.wide{max-width:820px}
.modal.xwide{max-width:1000px}
.modal-head{
  padding:16px 20px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);
}
.modal-head h3{font-family:var(--serif);font-size:16px;font-weight:700;flex:1}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-foot{
  padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;
  justify-content:flex-end;align-items:center;
}
.btn{
  padding:7px 15px;border-radius:8px;font-size:12.5px;font-weight:500;
  transition:.14s;border:1px solid transparent;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(168,68,42,.25)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{border-color:var(--line-2);color:var(--ink-2);background:var(--paper)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--ink-4)}
.btn-danger{color:#b33;border-color:#e3c3c0}
.btn-danger:hover{background:#fbeeed}
.btn-sm{padding:5px 10px;font-size:11.5px}

/* 统计视图 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
}
.stat-card .sc-v{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-card .sc-l{font-size:11px;color:var(--ink-4);margin-top:3px}
.stat-card.hl{background:var(--accent-soft);border-color:transparent}
.stat-card.hl .sc-v{color:var(--accent)}

.heatmap{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
.hm-col{display:flex;flex-direction:column;gap:3px}
.hm-cell{width:11px;height:11px;border-radius:2.5px;background:var(--paper-3)}
.hm-cell[data-l="1"]{background:color-mix(in srgb,var(--accent) 22%,var(--paper-3))}
.hm-cell[data-l="2"]{background:color-mix(in srgb,var(--accent) 44%,var(--paper-3))}
.hm-cell[data-l="3"]{background:color-mix(in srgb,var(--accent) 66%,var(--paper-3))}
.hm-cell[data-l="4"]{background:var(--accent)}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-4);margin-top:6px;justify-content:flex-end}
.hm-legend .hm-cell{width:9px;height:9px}

.bar-chart{display:flex;align-items:flex-end;gap:5px;height:96px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bar{width:100%;max-width:30px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;transition:height .4s;opacity:.85}
.bar-col .bar-l{font-size:9.5px;color:var(--ink-4);white-space:nowrap}
.bar-col:hover .bar{opacity:1}

.progress-line{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.progress-line .pl-name{width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.progress-line .pl-bar{flex:1;height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden}
.progress-line .pl-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.progress-line .pl-num{width:64px;text-align:right;color:var(--ink-4);font-size:11px;font-variant-numeric:tabular-nums}

/* 搜索面板 */
.search-result{
  padding:9px 11px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:2px;
}
.search-result:hover{background:var(--paper-2)}
.search-result .sr-t{font-size:12.5px;font-weight:600;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.search-result .sr-s{font-size:11.5px;color:var(--ink-3);line-height:1.65}
.search-result mark{background:var(--gold-soft);color:var(--gold);padding:0 2px;border-radius:2px;font-weight:600}
.sr-kind{font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--paper-3);color:var(--ink-4);font-weight:500}

/* Toast */
#toast-stack{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;
  font-size:12.5px;box-shadow:var(--shadow-md);animation:toastIn .22s cubic-bezier(.2,.8,.3,1);
  display:flex;align-items:center;gap:7px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}

/* 右键菜单 */
.ctx-menu{
  position:fixed;z-index:250;background:var(--paper);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow-lg);padding:4px;min-width:150px;display:none;
  animation:popIn .12s;
}
.ctx-menu.show{display:block}
.ctx-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);width:100%;text-align:left;
}
.ctx-item:hover{background:var(--paper-2);color:var(--ink)}
.ctx-item.danger{color:#b33}
.ctx-item.danger:hover{background:#fbeeed}
.ctx-sep{height:1px;background:var(--line);margin:4px 6px}
.ctx-item .k{margin-left:auto;font-size:10px;color:var(--ink-4)}

/* 专注模式 */
body.focus-mode #sidebar,body.focus-mode #inspector,body.focus-mode .topbar .focus-hide{display:none!important}
body.focus-mode .editor-inner{max-width:660px;padding-top:14vh}
body.focus-mode .topbar{opacity:.25;transition:opacity .3s;border-bottom-color:transparent}
body.focus-mode .topbar:hover{opacity:1}
body.focus-mode .statusbar{opacity:.3;transition:opacity .3s}
body.focus-mode .statusbar:hover{opacity:1}

/* 设定卡片弹窗内容 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mini-card{
  border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;
  transition:.15s;background:var(--paper-2);
}
.mini-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.mini-card .mc-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mini-card .mc-name{font-weight:600;font-size:13px}
.mini-card .mc-desc{font-size:11.5px;color:var(--ink-3);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.avatar-lg{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;font-family:var(--serif);flex:0 0 38px}
.avatar-lg.sq{border-radius:10px}

.chip-select{display:flex;flex-wrap:wrap;gap:5px;max-height:120px;overflow-y:auto;padding:2px}
.chip-opt{
  padding:3px 9px;border-radius:13px;font-size:11.5px;border:1px solid var(--line);
  cursor:pointer;transition:.12s;color:var(--ink-3);background:var(--paper);
}
.chip-opt:hover{border-color:var(--ink-4)}
.chip-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

.hr{height:1px;background:var(--line);margin:16px 0}
.muted{color:var(--ink-4);font-size:11.5px;line-height:1.8}
.kbd{
  display:inline-block;padding:1px 5px;border-radius:4px;background:var(--paper-3);
  font-size:10.5px;font-family:var(--sans);color:var(--ink-3);border-bottom:1px solid var(--line-2);
}

/* 响应式 */
@media (max-width:1180px){
  #inspector{width:280px;flex-basis:280px}
}
@media (max-width:980px){
  #inspector{position:absolute;right:0;top:0;bottom:0;box-shadow:var(--shadow-lg)}
  #sidebar{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow-lg)}
  .editor-inner{padding:32px 24px 40vh}
}
</style>

<script>
/* ============================================================
   墨迹 · 长篇小说写作工作台
   纯前端单文件，数据存 localStorage
   ============================================================ */
"use strict";

/* ---------------- 数据层 ---------------- */
const STORE_KEY = "moji.novel.v1";
const SETTINGS_KEY = "moji.settings.v1";

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const now = () => Date.now();

function countWords(text) {
  if (!text) return 0;
  // 中文按字计，英文按词计，忽略空白
  const cn = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  const en = (text.replace(/[\u4e00-\u9fa5]/g, ' ').match(/[A-Za-z0-9]+/g) || []).length;
  return cn + en;
}

const PALETTE = ["#a8442a","#3f6b58","#b08a3e","#4a5d8a","#7a4a6b","#2f6b6b","#8a5a2a","#5a5a8a","#6b8a3f","#8a3f5a"];
const hashColor = (s) => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return PALETTE[h % PALETTE.length]; };

function blankState() {
  return {
    version: 1,
    meta: {
      title: "未命名作品",
      author: "",
      genre: "",
      logline: "",
      createdAt: now(),
      updatedAt: now(),
    },
    volumes: [],   // {id, name, collapsed}
    chapters: [],  // {id, volId, title, content, status, note, castIds, threadIds, updatedAt, createdAt, order}
    characters: [],// {id, name, alias, role, age, appearance, personality, background, arc, color, relations:[{targetId,type,note}], tags:[]}
    world: [],     // {id, name, category, content, tags:[]}
    threads: [],   // {id, name, status:'open'|'done'|'drop', desc, chapterIds:[], color}
    refs: [],      // {id, title, content, source, chapterIds:[]}
    goals: { daily: 1000, deadline: "", targetWords: 0 },
    dailyLog: {},  // {"2026-10-26": 1200}
    streak: { lastDay: "", count: 0 },
  };
}

let S = blankState();
let UI = {
  activeChapter: null,
  activeTab: "chapters",
  inspTab: "chapter",
  sidebarOpen: true,
  inspectorOpen: true,
  focusMode: false,
  typewriter: false,
  typing: false,
  searchQ: "",
  searchMode: false,
  fontFamily: "serif",
  fontSize: 17,
  lineHeight: 2,
  autoSaveTimer: null,
  lastSavedAt: 0,
  dirty: false,
};

/* ---------------- 持久化 ---------------- */
let saveTimer = null;
function persist(immediate = false) {
  clearTimeout(saveTimer);
  const doSave = () => {
    try {
      S.meta.updatedAt = now();
      localStorage.setItem(STORE_KEY, JSON.stringify(S));
      UI.lastSavedAt = now();
      UI.dirty = false;
      flashSaved();
    } catch (e) {
      toast("保存失败：存储空间可能已满", "error");
      console.error(e);
    }
  };
  if (immediate) doSave(); else saveTimer = setTimeout(doSave, 400);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    S = Object.assign(blankState(), data);
    // 补齐字段
    S.goals = Object.assign({ daily: 1000, deadline: "", targetWords: 0 }, S.goals || {});
    S.dailyLog = S.dailyLog || {};
    S.streak = S.streak || { lastDay: "", count: 0 };
    return true;
  } catch (e) { console.error("读取失败", e); return false; }
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    UI.fontFamily = s.fontFamily || "serif";
    UI.fontSize = s.fontSize || 17;
    UI.lineHeight = s.lineHeight || 2;
    if (s.theme) document.documentElement.setAttribute("data-theme", s.theme);
    UI.sidebarOpen = s.sidebarOpen !== false;
    UI.inspectorOpen = s.inspectorOpen !== false;
  } catch (e) {}
}
function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({
    fontFamily: UI.fontFamily, fontSize: UI.fontSize, lineHeight: UI.lineHeight,
    theme: document.documentElement.getAttribute("data-theme") || "light",
    sidebarOpen: UI.sidebarOpen, inspectorOpen: UI.inspectorOpen,
  }));
}

/* ---------------- 工具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtNum = (n) => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(n);

function toast(msg, type = "info") {
  const el = document.createElement("div");
  el.className = "toast";
  const icon = type === "error" ? "⚠" : type === "success" ? "✓" : "·";
  el.innerHTML = `<span style="opacity:.7">${icon}</span><span>${esc(msg)}</span>`;
  $("#toast-stack").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, 2000);
}

function flashSaved() {
  const f = $("#saveFlash");
  f.classList.add("show");
  clearTimeout(f._t);
  f._t = setTimeout(() => f.classList.remove("show"), 1400);
  $("#sbSaved").textContent = "已保存 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
}

/* ---------------- 查询辅助 ---------------- */
const getChapter = (id) => S.chapters.find(c => c.id === id);
const getChar = (id) => S.characters.find(c => c.id === id);
const getThread = (id) => S.threads.find(t => t.id === id);
const getRef = (id) => S.refs.find(r => r.id === id);
const getVolume = (id) => S.volumes.find(v => v.id === id);

function chaptersOfVolume(volId) {
  return S.chapters.filter(c => c.volId === volId).sort((a, b) => a.order - b.order);
}
function totalWords() {
  return S.chapters.reduce((s, c) => s + countWords(c.content), 0);
}
function chapterWordCount(c) { return countWords(c.content); }

/* ---------------- 初始化 ---------------- */
function init() {
  loadSettings();
  const had = loadState();

  bindEvents();
  applyTypography();
  if (!UI.sidebarOpen) $("#sidebar").classList.add("hidden");
  if (!UI.inspectorOpen) $("#inspector").classList.add("hidden");

  if (!had || S.chapters.length === 0) {
    if (!had) S = blankState();
    showWelcome(true);
  } else {
    showWelcome(false);
    const first = S.chapters.slice().sort((a,b)=>a.order-b.order)[0];
    openChapter(first.id, false);
  }
  renderSidebar();
  renderInspector();
  updateGlobalStats();
  updateGoalRing();
  startDailyCheck();
  window.addEventListener("beforeunload", (e) => { if (UI.dirty) { persist(true); } });
}

function showWelcome(on) {
  $("#welcome").style.display = on ? "block" : "none";
  $("#editor").style.display = on ? "none" : "block";
  $(".topbar").style.opacity = on ? ".35" : "";
  $("#editorWrap").scrollTop = 0;
}

/* ---------------- 全局统计 ---------------- */
function updateGlobalStats() {
  $("#totalWc").textContent = fmtNum(totalWords()) + " 字";
}

function todayWords() {
  return S.dailyLog[todayStr()] || 0;
}

function addDailyWords(delta) {
  if (delta === 0) return;
  const d = todayStr();
  S.dailyLog[d] = Math.max(0, (S.dailyLog[d] || 0) + delta);
  updateGoalRing();
}

function updateGoalRing() {
  const t = todayWords(), g = S.goals.daily || 1000;
  $("#todayWc").textContent = t;
  $("#goalWc").textContent = g;
  const pct = Math.min(1, t / g);
  const C = 2 * Math.PI * 7.2;
  $("#wcRing").setAttribute("stroke-dasharray", C.toFixed(1));
  $("#wcRing").setAttribute("stroke-dashoffset", (C * (1 - pct)).toFixed(1));
  $("#sbGoal").textContent = `今日 ${t} 字`;
  $("#sbGoal").classList.toggle("on", pct >= 1);
  $("#wcRing").style.stroke = pct >= 1 ? "var(--jade)" : "var(--accent)";
}

function startDailyCheck() {
  // 连续写作天数
  const d = todayStr();
  if (S.streak.lastDay !== d) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
    if (S.streak.lastDay === yStr) S.streak.count = (S.streak.count || 0) + 1;
    else if (!S.streak.lastDay) S.streak.count = 1;
    else if (S.streak.lastDay !== d) S.streak.count = 1;
    S.streak.lastDay = d;
    persist();
  }
}

/* ---------------- 侧栏渲染 ---------------- */
function renderSidebar() {
  const body = $("#sideBody");
  body.innerHTML = "";
  if (UI.activeTab === "chapters") renderChapterTree(body);
  else if (UI.activeTab === "chars") renderCharList(body);
  else if (UI.activeTab === "world") renderWorldList(body);
  else if (UI.activeTab === "threads") renderThreadList(body);
}

function renderChapterTree(body) {
  if (S.volumes.length === 0 && S.chapters.length === 0) {
    body.innerHTML = `<div class="empty-hint"><b>还没有章节</b><br>点下面的按钮开始第一章</div>`;
  }
  S.volumes.forEach(vol => {
    const chs = chaptersOfVolume(vol.id);
    const total = chs.reduce((s, c) => s + countWords(c.content), 0);
    const head = document.createElement("div");
    head.className = "vol-head" + (vol.collapsed ? " collapsed" : "");
    head.innerHTML = `
      <span class="chev"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></span>
      <span class="vol-name">${esc(vol.name)}</span>
      <span class="vol-count">${chs.length}章 · ${fmtNum(total)}</span>
      <button class="vol-add" title="在此卷新建章节">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>`;
    head.querySelector(".chev").onclick = (e) => { e.stopPropagation(); vol.collapsed = !vol.collapsed; persist(); renderSidebar(); };
    head.querySelector(".vol-name").onclick = () => { vol.collapsed = !vol.collapsed; persist(); renderSidebar(); };
    head.querySelector(".vol-add").onclick = (e) => { e.stopPropagation(); newChapter(vol.id); };
    head.oncontextmenu = (e) => { e.preventDefault(); volumeMenu(e, vol); };
    body.appendChild(head);

    if (!vol.collapsed) {
      chs.forEach(ch => body.appendChild(chapterItem(ch, vol)));
    }
  });

  // 游离章节（无卷）
  const orphans = S.chapters.filter(c => !c.volId || !getVolume(c.volId)).sort((a,b)=>a.order-b.order);
  if (orphans.length) {
    const h = document.createElement("div");
    h.className = "vol-head";
    h.innerHTML = `<span class="chev"></span><span class="vol-name">未分卷</span><span class="vol-count">${orphans.length}章</span>`;
    body.appendChild(h);
    orphans.forEach(ch => body.appendChild(chapterItem(ch, null)));
  }

  const addVol = document.createElement("button");
  addVol.className = "side-add";
  addVol.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 新建卷`;
  addVol.onclick = () => newVolume();
  body.appendChild(addVol);

  if (!S.chapters.length) {
    const addCh = document.createElement("button");
    addCh.className = "side-add";
    addCh.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 新建章节`;
    addCh.onclick = () => newChapter(S.volumes[0]?.id || null);
    body.appendChild(addCh);
  }
}

function chapterItem(ch, vol) {
  const el = document.createElement("div");
  el.className = "ch-item" + (ch.id === UI.activeChapter ? " on" : "");
  el.dataset.id = ch.id;
  el.draggable = true;
  const wc = countWords(ch.content);
  let dot = "";
  if (ch.status === "draft") dot = `<span class="ch-dot" title="草稿"></span>`;
  else if (ch.status === "done") dot = `<span class="ch-dot" style="background:var(--jade)" title="已定稿"></span>`;
  el.innerHTML = `
    ${dot}
    <span class="ch-title">${esc(ch.title)}</span>
    <span class="ch-wc">${wc ? fmtNum(wc) : ""}</span>
    <button class="ch-more"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>`;

  el.onclick = (e) => { if (!e.target.closest(".ch-more")) openChapter(ch.id); };
  el.querySelector(".ch-more").onclick = (e) => { e.stopPropagation(); chapterMenu(e, ch); };
  el.oncontextmenu = (e) => { e.preventDefault(); chapterMenu(e, ch); };

  // 拖拽排序
  el.ondragstart = (e) => { e.dataTransfer.setData("text/plain", ch.id); el.classList.add("dragging"); };
  el.ondragend = () => { el.classList.remove("dragging"); $$(".ch-item").forEach(x => x.removeAttribute("data-drop")); };
  el.ondragover = (e) => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    $$(".ch-item").forEach(x => x.removeAttribute("data-drop"));
    el.setAttribute("data-drop", after ? "after" : "before");
  };
  el.ondrop = (e) => {
    e.preventDefault();
    const dragId = e.dataTransfer.getData("text/plain");
    if (!dragId || dragId === ch.id) return;
    const r = el.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    moveChapter(dragId, ch.id, after);
  };
  return el;
}

function moveChapter(dragId, targetId, after) {
  const drag = getChapter(dragId), target = getChapter(targetId);
  if (!drag || !target) return;
  const fromVol = drag.volId;
  drag.volId = target.volId;
  const list = chaptersOfVolume(target.volId).filter(c => c.id !== dragId);
  const idx = list.findIndex(c => c.id === targetId);
  // 插入并重排序号
  const newList = list.slice();
  newList.splice(after ? idx + 1 : idx, 0, drag);
  newList.forEach((c, i) => c.order = i);
  persist();
  renderSidebar();
  if (fromVol !== drag.volId) toast("章节已移动到其他卷");
}

/* ---------------- 章节操作 ---------------- */
function newChapter(volId = null) {
  UI.activeTab = "chapters";
  $$(".nav-tab").forEach(x => x.classList.toggle("on", x.dataset.tab === "chapters"));
  if (!volId) {
    if (!S.volumes.length) S.volumes.push({ id: uid(), name: "第一卷", collapsed: false });
    volId = S.volumes[0].id;
  }
  const order = chaptersOfVolume(volId).length;
  const ch = {
    id: uid(), volId, title: `第${order + 1}章`, content: "",
    status: "draft", note: "", castIds: [], threadIds: [],
    createdAt: now(), updatedAt: now(), order,
  };
  S.chapters.push(ch);
  persist();
  renderSidebar();
  openChapter(ch.id);
  setTimeout(() => {
    const t = $("#chapterTitle");
    t.focus();
    const range = document.createRange();
    range.selectNodeContents(t);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }, 60);
}

function newVolume() {
  const vol = { id: uid(), name: `第${S.volumes.length + 1}卷`, collapsed: false };
  S.volumes.push(vol);
  persist(); renderSidebar();
  toast("已新建 " + vol.name);
}

function openChapter(id, persistScroll = true) {
  if (UI.activeChapter === id) return;
  const ch = getChapter(id);
  if (!ch) return;
  // 切换到新章节前先保存当前
  if (UI.activeChapter) { flushEditor(); }
  UI.activeChapter = id;
  showWelcome(false);

  const ta = $("#editor");
  ta.value = ch.content;
  ta.readOnly = false;
  ta.placeholder = "在这里开始你的故事…";
  $("#chapterTitle").textContent = ch.title;
  updateChapterMeta();
  renderSidebar();
  renderInspector();
  updateGlobalStats();

  if (persistScroll) $("#editorWrap").scrollTop = 0;
  setTimeout(() => ta.focus(), 30);
}

function updateChapterMeta() {
  const ch = getChapter(UI.activeChapter);
  if (!ch) return;
  const wc = countWords($("#editor").value);
  $("#chapterWords").textContent = fmtNum(wc) + " 字";
  $("#chapterPos").textContent = `${countWords(ch.content) ? "" : ""}${ch.status === "done" ? "已定稿 · " : ch.status === "draft" ? "草稿 · " : ""}更新于 ${new Date(ch.updatedAt).toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" })}`;
}

function flushEditor() {
  const ch = getChapter(UI.activeChapter);
  if (!ch) return;
  const ta = $("#editor");
  const val = ta.value;
  if (val === ch.content) return;
  const oldWc = countWords(ch.content);
  ch.content = val;
  ch.updatedAt = now();
  const newWc = countWords(val);
  addDailyWords(newWc - oldWc);
  persist();
  updateGlobalStats();
  updateChapterMeta();
  renderSidebar();
}

/* ---------------- 右栏渲染 ---------------- */
function renderInspector() {
  const body = $("#inspBody");
  const ch = getChapter(UI.activeChapter);
  if (!ch) { body.innerHTML = `<div class="empty-hint">选择一个章节后<br>这里会显示相关设定</div>`; return; }

  if (UI.inspTab === "chapter") body.innerHTML = inspChapter(ch);
  else if (UI.inspTab === "cast") body.innerHTML = inspCast(ch);
  else if (UI.inspTab === "thread") body.innerHTML = inspThread(ch);
  else if (UI.inspTab === "note") body.innerHTML = inspNote(ch);
  else if (UI.inspTab === "ref") body.innerHTML = inspRef(ch);
  else if (UI.inspTab === "ai") body.innerHTML = inspAI(ch);
}

function inspChapter(ch) {
  const wc = countWords(ch.content);
  const vol = getVolume(ch.volId);
  const readMin = Math.max(1, Math.round(wc / 400));
  const statusOpts = [["draft","草稿"],["writing","写作中"],["done","已定稿"]];
  return `
    <div class="insp-sec">
      <div class="insp-sec-t">章节信息<span class="line"></span></div>
      <div class="field">
        <label>所属卷</label>
        <select id="chVolSelect">
          <option value="">未分卷</option>
          ${S.volumes.map(v => `<option value="${v.id}" ${v.id === ch.volId ? "selected" : ""}>${esc(v.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>状态</label>
        <div class="chip-select" id="chStatusSel">
          ${statusOpts.map(([k, v]) => `<span class="chip-opt ${ch.status === k ? "on" : ""}" data-k="${k}">${v}</span>`).join("")}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        <div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px">
          <div style="font-family:var(--serif);font-size:16px;font-weight:700">${fmtNum(wc)}</div>
          <div style="font-size:10px;color:var(--ink-4)">本章字数</div>
        </div>
        <div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px">
          <div style="font-family:var(--serif);font-size:16px;font-weight:700">${readMin}<span style="font-size:11px;font-weight:400"> 分</span></div>
          <div style="font-size:10px;color:var(--ink-4)">预计阅读</div>
        </div>
      </div>
    </div>
    <div class="insp-sec">
      <div class="insp-sec-t">场景速记<span class="line"></span></div>
      <div class="field">
        <label>这一章要完成什么（留给自己看）</label>
        <textarea id="chGoal" placeholder="例：让林砚第一次见到守夜人，埋下铜钥匙的线索…">${esc(ch.goal || "")}</textarea>
      </div>
    </div>`;
}

function inspCast(ch) {
  const cast = (ch.castIds || []).map(getChar).filter(Boolean);
  const others = S.characters.filter(c => !(ch.castIds || []).includes(c.id));
  return `
    <div class="insp-sec">
      <div class="insp-sec-t">本章出场<span class="line"></span></div>
      ${cast.length ? `<div class="cast-chips" style="margin-bottom:10px">
        ${cast.map(c => `<span class="cast-chip" data-cid="${c.id}">
          <span class="av" style="background:${c.color || hashColor(c.name)}">${esc(c.name.slice(0,1))}</span>
          ${esc(c.name)}<span class="rm" data-rm="${c.id}">×</span></span>`).join("")}
      </div>` : `<div class="muted" style="margin-bottom:10px">还没有标记出场人物</div>`}
      <div class="field">
        <label>点击添加</label>
        <div class="chip-select" style="max-height:150px">
          ${others.length ? others.map(c => `<span class="chip-opt" data-add="${c.id}">${esc(c.name)}</span>`).join("") : `<span class="muted">先在侧栏创建角色</span>`}
        </div>

      <div class="insp-sec-t">本章涉及伏笔<span class="line"></span></div>
      <div class="chip-select">
        ${S.threads.map(t => `<span class="chip-opt ${(ch.threadIds||[]).includes(t.id) ? "on" : ""}" data-th="${t.id}">${esc(t.name)}</span>`).join("") || `<span class="muted">还没有创建线索</span>`}
      </div>

function inspThread(ch) {
  const ts = (ch.threadIds || []).map(getThread).filter(Boolean);
  if (!ts.length) return `<div class="empty-hint" style="padding:24px 8px">本章还没有关联伏笔<br><button class="btn btn-ghost btn-sm" id="gotoCast" style="margin-top:12px">去「出场」页添加</button></div>`;

      <div class="th-desc">${esc(t.desc || "（无描述）")}</div>
      ${t.status !== 'done' ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px" data-closeth="${t.id}">标记为已收尾</button>` : ""}

function inspNote(ch) {
  return `<div class="insp-sec">
    <div class="insp-sec-t">随写随记<span class="line"></span></div>
    <div class="field">
      <textarea id="chNote" placeholder="写的时候想到什么就记在这里：待补的细节、要查的资料、想改的地方…" style="min-height:260px">${esc(ch.note || "")}</textarea>
    </div>
  </div>`;
}

function inspRef(ch) {
  const list = S.refs.filter(r => !r.chapterIds || !r.chapterIds.length || r.chapterIds.includes(ch.id));
  return `<div class="insp-sec">
    <div class="insp-sec-t">可用素材<span class="line"></span></div>
    ${list.length ? list.map(r => `<div class="ref-item" data-refid="${r.id}">
      <div>${esc(r.content)}</div>
      <div class="ref-src">${esc(r.title || "")}${r.source ? " · " + esc(r.source) : ""}</div>
    </div>`).join("") : `<div class="muted">还没有素材卡片，点下面新建</div>`}
    <button class="side-add" id="btnNewRef" style="justify-content:center;border:1px dashed var(--line-2);margin-top:8px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 新建素材卡片
    </button>
  </div>`;
}

/* ---------------- 编辑器事件 ---------------- */
function bindEditor() {
  const ta = $("#editor");
  ta.addEventListener("input", () => {
    UI.dirty = true;
    const ch = getChapter(UI.activeChapter);
    if (!ch) return;
    const oldWc = countWords(ch.content);
    const newWc = countWords(ta.value);
    if (newWc !== oldWc) {
      addDailyWords(newWc - oldWc);
      ch.content = ta.value;
      ch.updatedAt = now();
      $("#chapterWords").textContent = fmtNum(newWc) + " 字";
      updateGlobalStats();
      clearTimeout(UI.autoSaveTimer);
      UI.autoSaveTimer = setTimeout(() => { persist(); renderSidebar(); }, 900);
    } else {
      ch.content = ta.value;
      clearTimeout(UI.autoSaveTimer);
      UI.autoSaveTimer = setTimeout(() => persist(), 900);
    }
    updateSelInfo();
    if (UI.typewriter) centerCaret();
  });

  ta.addEventListener("keyup", updateSelInfo);
  ta.addEventListener("click", updateSelInfo);
  ta.addEventListener("scroll", () => {});
}

function updateSelInfo() {
  const ta = $("#editor");
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { $("#sbSel").textContent = ""; return; }
  const sel = ta.value.slice(s, e);
  $("#sbSel").textContent = `已选中 ${countWords(sel)} 字`;
}

function centerCaret() {
  const ta = $("#editor");
  const wrap = $("#editorWrap");
  const lineH = parseFloat(getComputedStyle(ta).lineHeight) || 34;
  const before = ta.value.slice(0, ta.selectionStart);
  const lines = before.split("\n").length;
  const target = (lines - 1) * lineH - wrap.clientHeight / 2 + 60;
  wrap.scrollTop = Math.max(0, target);
}

/* ---------------- 主事件绑定 ---------------- */
function bindEvents() {
  bindEditor();

  // 标题编辑
  const titleEl = $("#chapterTitle");
  titleEl.addEventListener("blur", () => {
    const ch = getChapter(UI.activeChapter);
    if (!ch) return;
    const v = titleEl.textContent.trim() || "未命名";
    titleEl.textContent = v;
    if (ch.title !== v) { ch.title = v; persist(); renderSidebar(); }
  });
  titleEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); $("#editor").focus(); } });

  // 侧栏 tab
  $$(".nav-tab").forEach(t => t.onclick = () => {
    $$(".nav-tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    UI.activeTab = t.dataset.tab;
    renderSidebar();
  });

  // 右栏 tab
  $$(".insp-tab").forEach(t => t.onclick = () => {
    $$(".insp-tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    UI.inspTab = t.dataset.itab;
    renderInspector();
  });

  $("#btnSidebar").onclick = () => {
    UI.sidebarOpen = !UI.sidebarOpen;
    $("#sidebar").classList.toggle("hidden", !UI.sidebarOpen);
    saveSettings();
  };
  $("#btnInspector").onclick = () => {
    UI.inspectorOpen = !UI.inspectorOpen;
    $("#inspector").classList.toggle("hidden", !UI.inspectorOpen);
    saveSettings();
  };
  $("#btnFocus").onclick = () => {
    UI.focusMode = !UI.focusMode;
    document.body.classList.toggle("focus-mode", UI.focusMode);
    $("#btnFocus").classList.toggle("on", UI.focusMode);
    setTimeout(() => $("#editor").focus(), 100);
  };
  $("#btnTypewriter").onclick = () => {
    UI.typewriter = !UI.typewriter;
    document.body.classList.toggle("typing-mode", UI.typewriter);
    $("#btnTypewriter").classList.toggle("on", UI.typewriter);
    if (UI.typewriter) centerCaret();
  };
  $("#btnTheme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    saveSettings();
  };
  $("#btnMore").onclick = (e) => moreMenu(e);
  $("#btnStats").onclick = () => openStats();
  $("#btnSettings").onclick = () => openSettings();
  $("#wcBox").onclick = () => openGoalDialog();
  $("#sbGoal").onclick = () => openGoalDialog();
  $("#welcome").onclick = (e) => {
    const c = e.target.closest(".w-card"); if (!c) return;
    const act = c.dataset.act;
    if (act === "newchapter") newChapter();
    else if (act === "demo") loadDemo();
    else if (act === "import") importBackup();
    else if (act === "newchar") { UI.activeTab = "chars"; $$(".nav-tab").forEach(x=>x.classList.toggle("on", x.dataset.tab==="chars")); renderSidebar(); openCharacter(null); }
  };

  // 模态框
  $("#modalClose").onclick = closeModal;
  $("#modalMask").onclick = (e) => { if (e.target.id === "modalMask") closeModal(); };

  // 搜索
  const ss = $("#sideSearch");
  ss.addEventListener("input", () => {
    UI.searchQ = ss.value.trim();
    if (UI.searchQ) { openSearchResults(UI.searchQ); }
    else { renderSidebar(); }
  });
  ss.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { ss.value = ""; UI.searchQ = ""; renderSidebar(); ss.blur(); }
  });

  // 键盘快捷键
  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); ss.focus(); ss.select(); return; }
    if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); $("#btnSidebar").click(); return; }
    if (mod && e.key.toLowerCase() === "i") { e.preventDefault(); $("#btnInspector").click(); return; }
    if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); flushEditor(); persist(true); toast("已保存", "success"); return; }
    if (mod && e.key.toLowerCase() === "n" && e.shiftKey) { e.preventDefault(); newChapter(S.chapters.find(c=>c.id===UI.activeChapter)?.volId || null); return; }
    if (e.key === "Escape") {
      if ($("#modalMask").classList.contains("show")) closeModal();
      else if (UI.focusMode) $("#btnFocus").click();
      else if ($("#ctxMenu").classList.contains("show")) hideCtx();
    }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#ctxMenu") && !e.target.closest(".ch-more") && !e.target.closest(".vol-add") && !e.target.closest("#btnMore")) hideCtx();
  });

  // 右栏事件委托
  $("#inspBody").addEventListener("click", handleInspClick);
  $("#inspBody").addEventListener("input", handleInspInput);
}

function handleInspClick(e) {
  const ch = getChapter(UI.activeChapter);
  if (!ch) return;
  if (UI.inspTab === "ai") { handleInspAiClick(e); return; }
  const addC = e.target.closest("[data-add]");
  const rmC = e.target.closest("[data-rm]");
  const th = e.target.closest("[data-th]");
  const closeTh = e.target.closest("[data-closeth]");
  const castChip = e.target.closest(".cast-chip");
  const refit = e.target.closest("[data-refid]");

  if (addC) {
    ch.castIds = ch.castIds || [];
    if (!ch.castIds.includes(addC.dataset.add)) ch.castIds.push(addC.dataset.add);
    persist(); renderInspector(); return;
  }
  if (rmC) {
    ch.castIds = (ch.castIds || []).filter(id => id !== rmC.dataset.rm);
    persist(); renderInspector(); return;
  }
  if (th) {
    ch.threadIds = ch.threadIds || [];
    const id = th.dataset.th;
    if (ch.threadIds.includes(id)) ch.threadIds = ch.threadIds.filter(x => x !== id);
    else ch.threadIds.push(id);
    // 同步线索的章节列表
    const t = getThread(id);
    if (t) {
      t.chapterIds = t.chapterIds || [];
      if (!t.chapterIds.includes(ch.id)) t.chapterIds.push(ch.id);
    }
    persist(); renderInspector(); renderSidebar(); return;
  }
  if (closeTh) {
    const t = getThread(closeTh.dataset.closeth);
    if (t) { t.status = "done"; persist(); renderInspector(); toast("伏笔已收尾"); }
    return;
  }
  if (castChip && !e.target.closest(".rm")) { openCharacter(castChip.dataset.cid); return; }
  if (refit) { insertRef(refit.dataset.refid); return; }
  if (e.target.id === "btnNewRef") { openRef(null); return; }
  if (e.target.id === "gotoCast") { $$(".insp-tab").forEach(x=>x.classList.toggle("on", x.dataset.itab==="cast")); UI.inspTab="cast"; renderInspector(); return; }
  const st = e.target.closest("#chStatusSel .chip-opt");
  if (st) { ch.status = st.dataset.k; persist(); renderInspector(); updateChapterMeta(); renderSidebar(); }
}

function handleInspInput(e) {
  const ch = getChapter(UI.activeChapter);
  if (!ch) return;
  if (e.target.id === "aiWords") {
    UI.aiSel.words = +e.target.value;
    $("#aiWordsLbl").textContent = e.target.value;
  }
  if (e.target.id === "aiOutline") { UI.aiOutline = e.target.value; }
  if (e.target.id === "chNote") { ch.note = e.target.value; persist(); }
  if (e.target.id === "chGoal") { ch.goal = e.target.value; persist(); }
  if (e.target.id === "chVolSelect") {
    ch.volId = e.target.value || null;
    ch.order = chaptersOfVolume(ch.volId).filter(c => c.id !== ch.id).length;
    persist(); renderSidebar();
  }
}

/* ---------------- 右键菜单 ---------------- */
function showCtx(x, y, items) {
  const m = $("#ctxMenu");
  m.innerHTML = items.map(it => it.sep ? `<div class="ctx-sep"></div>`
    : `<button class="ctx-item ${it.danger ? 'danger' : ''}" data-k="${it.k}">${it.label}${it.hint ? `<span class="k">${it.hint}</span>` : ""}</button>`).join("");
  m.classList.add("show");
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  m.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
  m.onclick = (e) => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    hideCtx();
    const it = items.find(i => i.k === b.dataset.k);
    if (it && it.fn) it.fn();
  };
}
function hideCtx() { $("#ctxMenu").classList.remove("show"); }

function chapterMenu(e, ch) {
  showCtx(e.clientX, e.clientY, [
    { k: "rename", label: "重命名", fn: () => {
        const n = prompt("章节标题", ch.title);
        if (n !== null && n.trim()) { ch.title = n.trim(); persist(); renderSidebar(); if (UI.activeChapter === ch.id) $("#chapterTitle").textContent = ch.title; }
      } },
    { k: "dup", label: "复制本章", fn: () => {
        const cp = JSON.parse(JSON.stringify(ch));
        cp.id = uid(); cp.title = ch.title + " 副本"; cp.createdAt = now(); cp.updatedAt = now();
        cp.order = ch.order + 1;
        S.chapters.filter(c => c.volId === ch.volId && c.order > ch.order).forEach(c => c.order++);
        S.chapters.push(cp); persist(); renderSidebar(); toast("已复制");
      } },
    { k: "move", label: "移动到顶部", fn: () => {
        const list = chaptersOfVolume(ch.volId).filter(c => c.id !== ch.id);
        const newList = [ch, ...list]; newList.forEach((c,i)=>c.order=i);
        persist(); renderSidebar();
      } },
    { sep: true },
    { k: "export", label: "导出为 Markdown", fn: () => exportChapterMd(ch) },
    { sep: true },
    { k: "del", label: "删除本章", danger: true, fn: () => {
        if (!confirm(`确认删除「${ch.title}」？此操作不可撤销。`)) return;
        S.chapters = S.chapters.filter(c => c.id !== ch.id);
        if (UI.activeChapter === ch.id) {
          UI.activeChapter = null;
          const next = S.chapters.sort((a,b)=>a.order-b.order)[0];
          if (next) openChapter(next.id); else { $("#editor").value = ""; showWelcome(true); renderInspector(); }
        }
        persist(); renderSidebar(); updateGlobalStats(); toast("已删除");
      } },
  ]);
}

function volumeMenu(e, vol) {
  showCtx(e.clientX, e.clientY, [
    { k: "rename", label: "重命名卷", fn: () => {
        const n = prompt("卷名", vol.name);
        if (n !== null && n.trim()) { vol.name = n.trim(); persist(); renderSidebar(); }
      } },
    { k: "add", label: "在此卷新建章节", fn: () => newChapter(vol.id) },
    { sep: true },
    { k: "del", label: "删除此卷（章节保留）", danger: true, fn: () => {
        if (!confirm(`删除「${vol.name}」？卷内章节会移到未分卷。`)) return;
        S.chapters.filter(c => c.volId === vol.id).forEach(c => c.volId = null);
        S.volumes = S.volumes.filter(v => v.id !== vol.id);
        persist(); renderSidebar();
      } },
  ]);
}

function entityMenu(e, kind, obj) {
  const label = kind === "character" ? "角色" : kind === "world" ? "设定" : "线索";
  showCtx(e.clientX, e.clientY, [
    { k: "edit", label: "编辑", fn: () => {
        if (kind === "character") openCharacter(obj.id);
        else if (kind === "world") openWorld(obj.id);
        else openThread(obj.id);
      } },
    { sep: true },
    { k: "del", label: `删除此${label}`, danger: true, fn: () => {
        if (!confirm(`确认删除「${obj.name}」？`)) return;
        if (kind === "character") {
          S.characters = S.characters.filter(c => c.id !== obj.id);
          S.chapters.forEach(c => c.castIds = (c.castIds||[]).filter(i => i !== obj.id));
        } else if (kind === "world") S.world = S.world.filter(w => w.id !== obj.id);
        else {
          S.threads = S.threads.filter(t => t.id !== obj.id);
          S.chapters.forEach(c => c.threadIds = (c.threadIds||[]).filter(i => i !== obj.id));
        }
        persist(); renderSidebar(); renderInspector(); toast("已删除");
      } },
  ]);
}

function moreMenu(e) {
  const r = e.currentTarget.getBoundingClientRect();
  showCtx(r.left - 60, r.bottom + 4, [
    { k: "newChapter", label: "新建章节", hint: "Ctrl+Shift+N", fn: () => newChapter(S.chapters.find(c=>c.id===UI.activeChapter)?.volId || null) },
    { k: "newVol", label: "新建卷", fn: () => newVolume() },
    { sep: true },
    { k: "exportAll", label: "导出全稿 (Markdown)", fn: () => exportAllMd() },
    { k: "exportTxt", label: "导出全稿 (TXT)", fn: () => exportAllTxt() },
    { k: "backup", label: "备份为 JSON", fn: () => exportBackup() },
    { k: "import", label: "从 JSON 恢复", fn: () => importBackup() },
    { sep: true },
    { k: "reset", label: "新建空白作品（清空当前）", danger: true, fn: () => resetAll() },
    { sep: true },
    { k: "meta", label: "作品信息", fn: () => openMeta() },
    { k: "stats", label: "写作统计", fn: () => openStats() },
    { k: "settings", label: "排版设置", fn: () => openSettings() },
  ]);
}

/* ============================================================
   弹窗系统
   ============================================================ */
function openModal(title, bodyHtml, footHtml, cls = "") {
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHtml;
  $("#modalFoot").innerHTML = footHtml || "";
  $("#modal").className = "modal " + cls;
  $("#modalMask").classList.add("show");
}
function closeModal() { $("#modalMask").classList.remove("show"); }

/* ---------- 角色编辑 ---------- */
function openCharacter(id) {
  const isNew = !id;
  const c = isNew ? {
    id: uid(), name: "", alias: "", role: "配角", age: "", gender: "",
    appearance: "", personality: "", background: "", arc: "", color: PALETTE[0],
    relations: [], tags: [],
  } : JSON.parse(JSON.stringify(getChar(id)));

  const body = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
      <div class="avatar-lg" id="charAvatar" style="background:${c.color}">${esc((c.name||"?").slice(0,1))}</div>
      <div style="flex:1">
        <div class="field" style="margin:0">
          <input id="cName" placeholder="角色姓名" value="${esc(c.name)}" style="font-size:15px;font-weight:600;font-family:var(--serif)">
        </div>
      </div>
      <div class="field" style="margin:0;width:90px">
        <select id="cRole">
          ${["主角","配角","反派","次要"].map(r => `<option ${c.role===r?"selected":""}>${r}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>别名 / 称呼</label><input id="cAlias" value="${esc(c.alias)}" placeholder="如：老林、林先生"></div>
      <div class="field" style="max-width:100px"><label>年龄</label><input id="cAge" value="${esc(c.age)}" placeholder="28"></div>
      <div class="field" style="max-width:100px"><label>性别</label><input id="cGender" value="${esc(c.gender||"")}" placeholder="男 / 女"></div>
    </div>
    <div class="field"><label>外貌特征</label><textarea id="cAppearance" placeholder="身高、长相、习惯性动作、穿衣风格…">${esc(c.appearance)}</textarea></div>
    <div class="field"><label>性格</label><textarea id="cPersonality" placeholder="核心性格、说话方式、在意什么、怕什么…">${esc(c.personality)}</textarea></div>
    <div class="field"><label>背景</label><textarea id="cBackground" placeholder="出身、经历、和别人的关系…">${esc(c.background)}</textarea></div>
    <div class="field"><label>人物弧光（从哪到哪）</label><textarea id="cArc" placeholder="开场时他是……结局时他变成……">${esc(c.arc)}</textarea></div>
    <div class="field"><label>标签</label>
      <input id="cTags" value="${esc((c.tags||[]).join("、"))}" placeholder="用顿号分隔，如：复仇、隐忍、左撇子">
    </div>
    <div class="field"><label>代表色</label>
      <div class="chip-select" id="colorPick">
        ${PALETTE.map(p => `<span class="chip-opt ${c.color===p?"on":""}" data-c="${p}" style="background:${p};width:22px;height:22px;border-radius:50%;padding:0;${c.color===p?'outline:2px solid '+p+';outline-offset:2px':''}"></span>`).join("")}
      </div>
    </div>
    <div class="hr"></div>
    <div class="insp-sec-t">人物关系<span class="line"></span></div>
    <div id="relList"></div>
    <button class="btn btn-ghost btn-sm" id="addRel" style="margin-top:6px">+ 添加关系</button>
  `;
  const foot = `
    ${isNew ? "" : `<button class="btn btn-danger btn-sm" id="delChar" style="margin-right:auto">删除角色</button>`}
    <button class="btn btn-ghost" id="cancelChar">取消</button>
    <button class="btn btn-primary" id="saveChar">${isNew ? "创建" : "保存"}</button>
  `;
  openModal(isNew ? "新建角色" : "编辑角色", body, foot, "wide");

  const renderRels = () => {
    $("#relList").innerHTML = (c.relations || []).map((r, i) => {
      const t = getChar(r.targetId);
      return `<div class="rel-item">
        <span class="ent-avatar" style="background:${t ? (t.color || hashColor(t.name)) : '#999'};width:18px;height:18px;flex:0 0 18px;font-size:9px">${esc(t ? t.name.slice(0,1) : "?")}</span>
        <span>${esc(t ? t.name : "（已删除）")}</span>
        <span class="rel-type">${esc(r.type || "")}${r.note ? " · " + esc(r.note) : ""}</span>
        <button class="icon-btn" data-rrel="${i}" style="width:20px;height:20px;margin-left:4px">×</button>
      </div>`;
    }).join("") || `<div class="muted">还没有添加关系</div>`;
    $$("[data-rrel]").forEach(b => b.onclick = () => { c.relations.splice(+b.dataset.rrel, 1); renderRels(); });
  };
  renderRels();

  $("#addRel").onclick = () => {
    const others = S.characters.filter(x => x.id !== c.id);
    if (!others.length) return toast("先创建其他角色才能添加关系");
    const html = `
      <div class="field"><label>对方角色</label>
        <select id="relTarget">${others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>
      </div>
      <div class="field"><label>关系类型</label>
        <input id="relType" placeholder="如：师徒、宿敌、兄妹、暗恋" list="relTypes">
        <datalist id="relTypes"><option>亲兄妹</option><option>师徒</option><option>宿敌</option><option>挚友</option><option>暗恋</option><option>上下级</option><option>杀父仇人</option></datalist>
      </div>
      <div class="field"><label>补充说明</label><input id="relNote" placeholder="这段关系的张力在哪"></div>`;
    openModal("添加人物关系", html, `<button class="btn btn-ghost" id="relCancel">取消</button><button class="btn btn-primary" id="relOk">添加</button>`);
    $("#relCancel").onclick = () => openCharacter(id); // 回退重开
    $("#relOk").onclick = () => {
      const tid = $("#relTarget").value;
      c.relations = c.relations || [];
      c.relations.push({ targetId: tid, type: $("#relType").value.trim(), note: $("#relNote").value.trim() });
      // 重新打开主编辑框并保留草稿
      const draft = captureCharDraft(c);
      draft.relations = c.relations;
      renderCharEditorWithDraft(draft, isNew);
    };
  };

  $$("#colorPick .chip-opt").forEach(p => p.onclick = () => {
    c.color = p.dataset.c;
    $$("#colorPick .chip-opt").forEach(x => { x.classList.remove("on"); x.style.outline = "none"; });
    p.classList.add("on"); p.style.outline = `2px solid ${c.color}`; p.style.outlineOffset = "2px";
    $("#charAvatar").style.background = c.color;
  });
  $("#cName").oninput = (e) => { $("#charAvatar").textContent = (e.target.value || "?").slice(0,1); };

  $("#cancelChar").onclick = closeModal;
  $("#saveChar").onclick = () => {
    const name = $("#cName").value.trim();
    if (!name) return toast("角色需要一个名字");
    const data = captureCharDraft(c);
    if (isNew) S.characters.push(data);
    else {
      const i = S.characters.findIndex(x => x.id === data.id);
      if (i >= 0) S.characters[i] = data;
    }
    persist(); renderSidebar(); renderInspector(); closeModal();
    toast(isNew ? "角色已创建" : "已保存", "success");
  };
  if (!isNew) $("#delChar").onclick = () => {
    if (!confirm(`确认删除「${c.name}」？`)) return;
    S.characters = S.characters.filter(x => x.id !== c.id);
    S.chapters.forEach(x => x.castIds = (x.castIds||[]).filter(i => i !== c.id));
    persist(); renderSidebar(); renderInspector(); closeModal(); toast("已删除");
  };
}

function captureCharDraft(c) {
  return Object.assign({}, c, {
    name: $("#cName").value.trim() || c.name,
    alias: $("#cAlias").value.trim(),
    role: $("#cRole").value,
    age: $("#cAge").value.trim(),
    gender: $("#cGender").value.trim(),
    appearance: $("#cAppearance").value,
    personality: $("#cPersonality").value,
    background: $("#cBackground").value,
    arc: $("#cArc").value,
    tags: $("#cTags").value.split(/[、,，\s]+/).filter(Boolean),
    relations: c.relations || [],
  });
}
function renderCharEditorWithDraft(draft, isNew) {
  const tmp = S.characters.find(x => x.id === draft.id);
  const backup = tmp ? JSON.parse(JSON.stringify(tmp)) : null;
  if (!isNew && tmp) {
    Object.assign(tmp, draft);
    openCharacter(draft.id);
    Object.assign(S.characters.find(x=>x.id===draft.id), draft);
    // 重填表单
    setTimeout(() => {
      if ($("#cName")) $("#cName").value = draft.name;
      if ($("#cAlias")) $("#cAlias").value = draft.alias || "";
    }, 0);
  } else {
    // 新建时：把草稿暂存，直接打开新角色并回填
    openCharacter(null);
    setTimeout(() => {
      $("#cName").value = draft.name || "";
      $("#cAlias").value = draft.alias || "";
      $("#cAge").value = draft.age || "";
      $("#cGender").value = draft.gender || "";
      $("#cAppearance").value = draft.appearance || "";

function openWorld(id) {

    <div class="field-row">

      </div>
    </div>
    <div class="field"><label>详细描述</label>
      <textarea id="wContent" style="min-height:220px" placeholder="这个地方/组织/规则是什么样的？它对故事有什么作用？有什么禁忌？">${esc(w.content)}</textarea>

     <button class="btn btn-ghost" id="cancelW">取消</button>
     <button class="btn btn-primary" id="saveW">${isNew ? "创建" : "保存"}</button>`, "wide");

  $("#cancelW").onclick = closeModal;
  $("#saveW").onclick = () => {
    const name = $("#wName").value.trim();
    if (!name) return toast("需要填名称");
    const data = { id: w.id, name, category: $("#wCat").value, content: $("#wContent").value,
      tags: $("#wTags").value.split(/[、,，\s]+/).filter(Boolean) };
    if (isNew) S.world.push(data);
    else { const i = S.world.findIndex(x => x.id === data.id); if (i>=0) S.world[i] = data; }

  };
  if (!isNew) $("#delW").onclick = () => {
    if (!confirm(`确认删除「${w.name}」？`)) return;
    S.world = S.world.filter(x => x.id !== w.id);
    persist(); renderSidebar(); closeModal(); toast("已删除");
  };
}
const getWorld = (id) => S.world.find(w => w.id === id);

/* ---------- 伏笔线索 ---------- */
function openThread(id) {
  const isNew = !id;
  const t = isNew ? { id: uid(), name: "", status: "open", desc: "", chapterIds: [] } : JSON.parse(JSON.stringify(getThread(id)));
  const chs = S.chapters.slice().sort((a,b)=>a.order-b.order);
  const body = `
    <div class="field"><label>线索名称</label><input id="tName" value="${esc(t.name)}" placeholder="如：铜钥匙的来历 / 母亲的死因" style="font-family:var(--serif);font-weight:600"></div>
    <div class="field"><label>说明</label><textarea id="tDesc" placeholder="埋了什么、打算怎么收、读者该在第几章隐约猜到">${esc(t.desc)}</textarea></div>
    <div class="field"><label>状态</label>
      <div class="chip-select" id="tStatus">
        ${[["open","连载中"],["done","已收尾"],["drop","已放弃"]].map(([k,v])=>`<span class="chip-opt ${t.status===k?"on":""}" data-k="${k}">${v}</span>`).join("")}
      </div>
    </div>
    <div class="field"><label>关联章节</label>
      <div class="chip-select" style="max-height:160px">
        ${chs.length ? chs.map(c => `<span class="chip-opt ${(t.chapterIds||[]).includes(c.id)?"on":""}" data-tc="${c.id}">${esc(c.title)}</span>`).join("") : `<span class="muted">还没有章节</span>`}
      </div>
    </div>`;
  openModal(isNew ? "新建伏笔线索" : "编辑伏笔线索", body,
    `${isNew ? "" : `<button class="btn btn-danger btn-sm" id="delT" style="margin-right:auto">删除</button>`}
     <button class="btn btn-ghost" id="cancelT">取消</button>
     <button class="btn btn-primary" id="saveT">${isNew ? "创建" : "保存"}</button>`, "wide");

  $$("#tStatus .chip-opt").forEach(p => p.onclick = () => {
    $$("#tStatus .chip-opt").forEach(x => x.classList.remove("on")); p.classList.add("on");
    t.status = p.dataset.k;
  });
  $$("[data-tc]").forEach(p => p.onclick = () => {
    p.classList.toggle("on");
    const cid = p.dataset.tc;
    t.chapterIds = t.chapterIds || [];
    if (p.classList.contains("on")) { if (!t.chapterIds.includes(cid)) t.chapterIds.push(cid); }
    else t.chapterIds = t.chapterIds.filter(x => x !== cid);
  });
  $("#cancelT").onclick = closeModal;
  $("#saveT").onclick = () => {
    const name = $("#tName").value.trim();
    if (!name) return toast("给线索起个名字");
    const data = { id: t.id, name, desc: $("#tDesc").value, status: t.status, chapterIds: t.chapterIds || [] };
    if (isNew) S.threads.push(data);
    else { const i = S.threads.findIndex(x => x.id === data.id); if (i>=0) S.threads[i] = data; }
    // 同步章节
    S.chapters.forEach(c => {
      c.threadIds = (c.threadIds || []).filter(x => x !== data.id);
      if (data.chapterIds.includes(c.id)) c.threadIds.push(data.id);
    });
    persist(); renderSidebar(); renderInspector(); closeModal(); toast("已保存", "success");
  };
  if (!isNew) $("#delT").onclick = () => {
    if (!confirm(`确认删除「${t.name}」？`)) return;
    S.threads = S.threads.filter(x => x.id !== t.id);
    S.chapters.forEach(c => c.threadIds = (c.threadIds||[]).filter(i => i !== t.id));
    persist(); renderSidebar(); renderInspector(); closeModal(); toast("已删除");
  };
}

/* ---------- 素材卡片 ---------- */
function openRef(id, presetChapterId) {
  const isNew = !id;
  const r = isNew ? { id: uid(), title: "", content: "", source: "", chapterIds: presetChapterId ? [presetChapterId] : [] } : JSON.parse(JSON.stringify(getRef(id)));
  const chs = S.chapters.slice().sort((a,b)=>a.order-b.order);
  const body = `
    <div class="field"><label>标题</label><input id="rTitle" value="${esc(r.title)}" placeholder="如：真实的雨夜气味 / 一段可用的对话"></div>
    <div class="field"><label>内容</label><textarea id="rContent" style="min-height:160px" placeholder="灵感、摘抄、观察、待用的句子…">${esc(r.content)}</textarea></div>
    <div class="field"><label>来源</label><input id="rSource" value="${esc(r.source)}" placeholder="书 / 电影 / 自己的观察"></div>
    <div class="field"><label>绑定章节（可选）</label>
      <div class="chip-select" style="max-height:130px">
        ${chs.length ? chs.map(c => `<span class="chip-opt ${(r.chapterIds||[]).includes(c.id)?"on":""}" data-rc="${c.id}">${esc(c.title)}</span>`).join("") : `<span class="muted">还没有章节</span>`}
      </div>
    </div>`;
  openModal(isNew ? "新建素材卡片" : "编辑素材", body,
    `<button class="btn btn-ghost" id="cancelR">取消</button><button class="btn btn-primary" id="saveR">${isNew ? "创建" : "保存"}</button>`);

  $$("[data-rc]").forEach(p => p.onclick = () => {
    p.classList.toggle("on");
    const cid = p.dataset.rc;
    r.chapterIds = r.chapterIds || [];
    if (p.classList.contains("on")) { if (!r.chapterIds.includes(cid)) r.chapterIds.push(cid); }
    else r.chapterIds = r.chapterIds.filter(x => x !== cid);
  });
  $("#cancelR").onclick = closeModal;
  $("#saveR").onclick = () => {
    const data = { id: r.id, title: $("#rTitle").value.trim(), content: $("#rContent").value,
      source: $("#rSource").value.trim(), chapterIds: r.chapterIds || [] };
    if (!data.content.trim()) return toast("内容不能为空");
    if (isNew) S.refs.push(data);
    else { const i = S.refs.findIndex(x => x.id === data.id); if (i>=0) S.refs[i] = data; }
    persist(); renderInspector(); closeModal(); toast("已保存", "success");
  };
}

function insertRef(id) {
  const r = getRef(id);
  if (!r) return;
  const ta = $("#editor");
  const pos = ta.selectionStart;
  const ins = r.content;
  ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(ta.selectionEnd);
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
  ta.dispatchEvent(new Event("input"));
  ta.focus();
  toast("素材已插入正文");
}

function buildAIPrompt() {
  const ch = getChapter(UI.activeChapter);
  const sel = UI.aiSel;
  const style = STYLES.find(s => s.k === sel.style);
  let sys = `你是一位中文小说写作高手。请按以下风格续写/创作正文，直接输出小说正文本身，不要任何解释、标题或前后缀。\n风格要求：${style.name}——${style.hint}。`;
  const parts = [];
  if (S.meta.title) parts.push(`【作品】《${S.meta.title}》${S.meta.genre ? "（" + S.meta.genre + "）" : ""}${S.meta.logline ? "：" + S.meta.logline : ""}`);
  if (sel.useCast && (ch.castIds || []).length) {
    const chars = (ch.castIds || []).map(getChar).filter(Boolean)
      .map(c => `${c.name}${c.alias ? "（" + c.alias + "）" : ""}，${c.role}，${c.age || ""}${c.gender || ""}。性格：${c.personality || "未设定"}。背景：${c.background || "未设定"}。弧光：${c.arc || ""}`).join("\n");
    if (chars) parts.push(`【本章出场人物】\n${chars}`);
  }
  if (sel.useThread && (ch.threadIds || []).length) {
    const ts = (ch.threadIds || []).map(getThread).filter(Boolean)
      .map(t => `${t.name}（${t.status === "done" ? "本章应收尾" : "埋设中"}）：${t.desc || ""}`).join("\n");
    if (ts) parts.push(`【相关伏笔】\n${ts}`);
  }
  if (sel.useGoal && ch.goal) parts.push(`【本章要完成的事】${ch.goal}`);
  if (sel.usePrev) {
    const tail = ch.content.slice(-600);
    if (tail.trim()) parts.push(`【前文结尾（从这里自然衔接）】\n${tail}`);
  }
  let task;
  if (sel.mode === "polish") {
    const ta = $("#editor");
    const chosen = ta.value.slice(ta.selectionStart, ta.selectionEnd) || ch.content.split(/\n\n+/).filter(Boolean).slice(-1)[0] || "";
    task = `请润色以下文字，保持情节与信息量不变，让语言更有质感：\n\n${chosen}`;
    sys += "\n只输出润色后的文字。";
  } else if (sel.mode === "outline") {
    UI.aiOutline = $("#aiOutline") ? $("#aiOutline").value : UI.aiOutline;
    task = `请根据大纲写出本章正文：\n${UI.aiOutline || "（无大纲，请依据上下文合理创作）"}`;
  } else {
    task = "请从前文结尾处自然续写下去。";
  }
  parts.push(`【任务】${task}\n目标长度：约 ${sel.words} 字。`);
  return { sys, user: parts.join("\n\n") };
}

async function callChatStream(messages, onDelta) {
  const cfg = loadAICfg();
  const url = cfg.url.replace(/\/+$/, "") + "/chat/completions";
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
    body: JSON.stringify({ model: cfg.model, messages, stream: true, temperature: 0.9 }),
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error(`接口返回 ${res.status}：${t.slice(0, 200)}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      const s = line.trim();
      if (!s.startsWith("data:")) continue;
      const payload = s.slice(5).trim();
      if (payload === "[DONE]") continue;
      try {
        const j = JSON.parse(payload);
        const delta = j.choices?.[0]?.delta?.content || "";
        if (delta) { full += delta; onDelta(full); }
      } catch (e) {}
    }
  }
  return full;
}

async function runAI() {
  const cfg = loadAICfg();
  if (!cfg.url || !cfg.key || !cfg.model) { openSettings("ai"); return; }
  const ch = getChapter(UI.activeChapter);
  if (!ch) return;
  flushEditor();
  const btn = $("#aiRun");
  const out = $("#aiOut");
  btn.disabled = true;
  btn.textContent = "生成中…";
  out.innerHTML = `<div style="border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:10px 12px;font-size:12.5px;line-height:1.9;max-height:300px;overflow-y:auto;white-space:pre-wrap;font-family:var(--serif)"><span style="color:var(--ink-4)">正在构思…</span></div>`;
  const box = out.firstChild;
  try {
    const { sys, user } = buildAIPrompt();
    let lastLen = 0;
    const full = await callChatStream(
      [{ role: "system", content: sys }, { role: "user", content: user }],
      (text) => {
        box.textContent = text;
        if (text.length - lastLen > 80) { box.scrollTop = box.scrollHeight; lastLen = text.length; }
      }
    );
    UI.aiResult = full;
    box.textContent = full;
    out.innerHTML = `<div style="border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:10px 12px;font-size:12.5px;line-height:1.9;max-height:300px;overflow-y:auto;white-space:pre-wrap;font-family:var(--serif)">${esc(full)}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-primary btn-sm" id="aiInsert" style="flex:1">插入正文</button>
        <button class="btn btn-ghost btn-sm" id="aiReplace" style="flex:1">替换选中</button>
        <button class="btn btn-ghost btn-sm" id="aiRetry">重试</button>
      </div>`;
    $("#aiInsert").onclick = () => {
      const ta = $("#editor");
      const pos = ta.selectionEnd;
      const ins = (ta.value.slice(0, pos).match(/\n\n$/) || ta.value.length === 0 ? "" : "\n\n") + full;
      ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(ta.selectionEnd);
      ta.dispatchEvent(new Event("input"));
      ta.focus();
      ta.selectionStart = ta.selectionEnd = pos + ins.length;
      toast("已插入正文", "success");
    };
    $("#aiReplace").onclick = () => {
      const ta = $("#editor");
      if (ta.selectionStart === ta.selectionEnd) return toast("请先在正文里选中要替换的文字");
      ta.value = ta.value.slice(0, ta.selectionStart) + full + ta.value.slice(ta.selectionEnd);
      ta.dispatchEvent(new Event("input"));
      toast("已替换", "success");
    };
    $("#aiRetry").onclick = () => runAI();
  } catch (err) {
    out.innerHTML = `<div style="background:#fbeeed;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7;color:#b33325">生成失败：${esc(err.message || String(err))}<br><span style="color:var(--ink-4)">请检查设置里的接口地址、Key 和模型名。常见接口地址如 https://api.openai.com/v1 或 https://api.deepseek.com/v1</span></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = UI.aiSel.mode === "polish" ? "开始润色" : "开始生成";
  }
}
