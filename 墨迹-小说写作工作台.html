/* ---------- 统计 ---------- */
function openStats() {
  const days = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({ key, w: S.dailyLog[key] || 0, label: `${d.getMonth()+1}/${d.getDate()}`, dow: d.getDay() });
  }
  const maxW = Math.max(1, ...days.map(d => d.w));
  const sum28 = days.reduce((s, d) => s + d.w, 0);
  const activeDays = days.filter(d => d.w > 0).length;
  const avg = activeDays ? Math.round(sum28 / activeDays) : 0;
  const target = S.goals.targetWords || 0;
  const total = totalWords();
  const pct = target ? Math.min(100, (total / target * 100)) : 0;

  // 热力图：最近 12 周
  const hmWeeks = [];
  const start = new Date(); start.setDate(start.getDate() - 83);
  // 对齐到周日
  start.setDate(start.getDate() - start.getDay());
  let cur = new Date(start);
  while (cur <= new Date()) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      const key = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      week.push({ key, w: S.dailyLog[key] || 0, future: cur > new Date() });
      cur.setDate(cur.getDate() + 1);
    }
    hmWeeks.push(week);
  }
  const hmMax = Math.max(1, ...hmWeeks.flat().map(d => d.w));

  const chaptersByVol = S.volumes.map(v => {
    const chs = chaptersOfVolume(v.id);
    const w = chs.reduce((s,c)=>s+countWords(c.content),0);
    return { name: v.name, w, n: chs.length };
  });

  const body = `
    <div class="stat-grid">
      <div class="stat-card hl"><div class="sc-v">${fmtNum(total)}</div><div class="sc-l">全书总字数</div></div>
      <div class="stat-card"><div class="sc-v">${S.chapters.length}</div><div class="sc-l">章节数</div></div>
      <div class="stat-card"><div class="sc-v">${todayWords()}</div><div class="sc-l">今日字数</div></div>
      <div class="stat-card"><div class="sc-v">${S.streak.count || 0}</div><div class="sc-l">连续写作天数</div></div>
    </div>

    ${target ? `
    <div class="insp-sec-t">全书进度<span class="line"></span></div>
    <div class="progress-line">
      <span class="pl-name">${esc(S.meta.title)}</span>
      <span class="pl-bar"><span class="pl-fill" style="width:${pct}%"></span></span>
      <span class="pl-num">${pct.toFixed(1)}%</span>
    </div>
    <div class="muted" style="margin-bottom:16px">还剩 ${fmtNum(target - total)} 字${S.goals.deadline ? `，截稿 ${S.goals.deadline}` : ""}</div>
    ` : ""}

    <div class="insp-sec-t">近 28 天<span class="line"></span></div>
    <div class="bar-chart" style="margin-bottom:6px">
      ${days.map(d => `<div class="bar-col" title="${d.key}：${d.w} 字">
        <div class="bar" style="height:${Math.max(2, d.w / maxW * 100)}%;${d.w===0?'background:var(--paper-3)':''}"></div>
        ${(d.dow === 1) ? `<span class="bar-l">${d.label}</span>` : `<span class="bar-l"> </span>`}
      </div>`).join("")}
    </div>
    <div class="muted" style="margin-bottom:18px">28 天共 ${fmtNum(sum28)} 字　·　有 ${activeDays} 天在写　·　日均 ${avg} 字</div>

    <div class="insp-sec-t">写作热力（近 12 周）<span class="line"></span></div>
    <div class="heatmap">
      ${hmWeeks.map(w => `<div class="hm-col">${w.map(d => {
        const lvl = d.w === 0 ? 0 : Math.min(4, Math.ceil(d.w / hmMax * 4));
        return `<div class="hm-cell" data-l="${lvl}" title="${d.key}：${d.w} 字"></div>`;
      }).join("")}</div>`).join("")}
    </div>
    <div class="hm-legend">少 <span class="hm-cell"></span><span class="hm-cell" data-l="1"></span><span class="hm-cell" data-l="2"></span><span class="hm-cell" data-l="3"></span><span class="hm-cell" data-l="4"></span> 多</div>

    <div class="hr"></div>
    <div class="insp-sec-t">各卷进度<span class="line"></span></div>
    ${chaptersByVol.map(v => {
      const p = total ? v.w / total * 100 : 0;
      return `<div class="progress-line">
        <span class="pl-name">${esc(v.name)}</span>
        <span class="pl-bar"><span class="pl-fill" style="width:${p}%;background:var(--jade)"></span></span>
        <span class="pl-num">${fmtNum(v.w)} 字</span>
      </div>`;
    }).join("") || `<div class="muted">还没有分卷</div>`}

    <div class="hr"></div>
    <div class="insp-sec-t">伏笔状态<span class="line"></span></div>
    <div class="muted" style="margin-bottom:10px">
      共 ${S.threads.length} 条，其中 <b style="color:var(--gold)">${S.threads.filter(t=>t.status!=="done"&&t.status!=="drop").length} 条未收尾</b>
    </div>
    ${S.threads.filter(t=>t.status!=="done").map(t=>`<div style="font-size:12px;padding:5px 0;color:var(--ink-2);display:flex;gap:6px;align-items:center">
      <span style="width:5px;height:5px;border-radius:50%;background:var(--gold)"></span>${esc(t.name)}
    </div>`).join("")}
  `;
  openModal("写作统计", body, `<button class="btn btn-ghost" id="stClose">关闭</button><button class="btn btn-primary" id="stGoal">调整目标</button>`, "wide");
  $("#stClose").onclick = closeModal;
  $("#stGoal").onclick = () => { closeModal(); setTimeout(openGoalDialog, 100); };
}

/* ---------- 搜索 ---------- */
function openSearchResults(q) {
  const ql = q.toLowerCase();
  const results = [];
  S.chapters.forEach(ch => {
    if (ch.title.toLowerCase().includes(ql)) results.push({ kind: "章节标题", id: ch.id, title: ch.title, snippet: "", ch: ch });
    const idx = ch.content.toLowerCase().indexOf(ql);
    if (idx >= 0) {
      const s = Math.max(0, idx - 40), e = Math.min(ch.content.length, idx + q.length + 60);
      results.push({ kind: "正文", id: ch.id, title: ch.title,
        snippet: (s > 0 ? "…" : "") + ch.content.slice(s, e) + (e < ch.content.length ? "…" : ""), ch });
    }
  });
  S.characters.forEach(c => { if ((c.name + (c.alias||"") + (c.personality||"") + (c.background||"")).toLowerCase().includes(ql)) results.push({ kind: "角色", title: c.name, snippet: c.personality || c.background || "", cid: c.id }); });
  S.world.forEach(w => { if ((w.name + w.content).toLowerCase().includes(ql)) results.push({ kind: "设定", title: w.name, snippet: w.content.slice(0, 90) }); });
  S.threads.forEach(t => { if ((t.name + t.desc).toLowerCase().includes(ql)) results.push({ kind: "伏笔", title: t.name, snippet: t.desc }); });
  S.refs.forEach(r => { if ((r.title + r.content).toLowerCase().includes(ql)) results.push({ kind: "素材", title: r.title || "素材", snippet: r.content.slice(0, 90) }); });

  const body = $("#sideBody");
  body.innerHTML = `<div style="padding:6px 8px 10px;font-size:11px;color:var(--ink-4)">找到 ${results.length} 条结果</div>` +
    (results.length ? results.slice(0, 60).map(r => `
      <div class="search-result" data-kind="${r.kind}" data-ch="${r.ch ? r.ch.id : ""}" data-cid="${r.cid || ""}" data-pos="${r.ch ? r.ch.content.toLowerCase().indexOf(ql) : -1}">
        <div class="sr-t"><span class="sr-kind">${r.kind}</span>${esc(r.title)}</div>
        ${r.snippet ? `<div class="sr-s">${highlight(r.snippet, q)}</div>` : ""}
      </div>`).join("") : `<div class="empty-hint">没有找到相关内容</div>`);

  $$(".search-result", body).forEach(el => el.onclick = () => {
    if (el.dataset.kind === "角色" && el.dataset.cid) { openCharacter(el.dataset.cid); return; }
    if (el.dataset.ch) {
      openChapter(el.dataset.ch);
      const pos = +el.dataset.pos;
      if (pos >= 0) setTimeout(() => {
        const ta = $("#editor");
        ta.focus();
        ta.selectionStart = ta.selectionEnd = pos;
        // 滚动到位置
        const lineH = parseFloat(getComputedStyle(ta).lineHeight);
        const lines = ta.value.slice(0, pos).split("\n").length;
        $("#editorWrap").scrollTop = Math.max(0, (lines - 6) * lineH);
      }, 60);
    }
  });
}
function highlight(text, q) {
  const safe = esc(text);
  const pq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(pq, "gi"), m => `<mark>${m}</mark>`);
}

/* ---------- 导入导出 ---------- */
function download(filename, content, mime = "text/plain;charset=utf-8") {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

function safeName(s) { return (s || "未命名").replace(/[\\/:*?"<>|]/g, "_").slice(0, 60); }

function exportAllMd() {
  flushEditor();
  let md = `# ${S.meta.title}\n\n`;
  if (S.meta.author) md += `> 作者：${S.meta.author}\n`;
  if (S.meta.genre) md += `> 类型：${S.meta.genre}\n`;
  if (S.meta.logline) md += `> ${S.meta.logline}\n`;
  md += `\n---\n\n`;
  S.volumes.forEach(v => {
    md += `## ${v.name}\n\n`;
    chaptersOfVolume(v.id).forEach(ch => {
      md += `### ${ch.title}\n\n${ch.content}\n\n`;
    });
  });
  const orphans = S.chapters.filter(c => !c.volId || !getVolume(c.volId));
  if (orphans.length) { md += `## 未分卷\n\n`; orphans.forEach(ch => { md += `### ${ch.title}\n\n${ch.content}\n\n`; }); }
  download(safeName(S.meta.title) + ".md", md, "text/markdown;charset=utf-8");
  toast("已导出 Markdown", "success");
}

function importBackup() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json,application/json";
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.chapters && !data.meta) throw new Error("格式不对");
        if (!confirm(`导入将替换当前所有内容（当前 ${S.chapters.length} 章）。建议先备份。继续吗？`)) return;
        S = Object.assign(blankState(), data);
        S.goals = Object.assign({ daily: 1000, deadline: "", targetWords: 0 }, S.goals || {});
        S.dailyLog = S.dailyLog || {};
        S.streak = S.streak || { lastDay: "", count: 0 };
        UI.activeChapter = null;
        persist(true);
        renderSidebar(); renderInspector(); updateGlobalStats(); updateGoalRing();
        const first = S.chapters.sort((a,b)=>a.order-b.order)[0];
        if (first) openChapter(first.id); else showWelcome(true);
        toast("导入成功", "success");
      } catch (err) { toast("文件格式不正确", "error"); }
    };
    reader.readAsText(f);
  };
  input.click();
}
